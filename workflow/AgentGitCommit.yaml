# reactor.AgentGitCommit@1.0.0
#
# An AI-driven git commit workflow.
#
# Gathers all relevant repository context upfront (branch, recent log, working-tree
# status, unstaged diff, staged diff) and feeds it to the Reactor agent.  The agent
# decides — based on the evidence — which git operation to perform:
#
#   commit          — stage nothing new; commit what is already staged.
#   add_and_commit  — stage tracked changes, then commit everything.
#   stash           — changes are incomplete / WIP; stash them.
#   abort           — nothing meaningful to do (clean tree or only untracked noise).
#
# The workflow extracts the agent's JSON decision, resolves the commit / stash
# message, and executes the correct git commands through pre-defined, safe
# cli_command steps — the agent NEVER executes arbitrary shell code.
#
# Inputs:
#   workdir   (optional) — absolute path of the git repo root; defaults to server cwd.
#   personaId (optional) — AI persona to consult; defaults to "reactor".
#   hint      (optional) — free-text context hint for the agent.
#   sessionId (optional) — resume an existing agent session (idempotent retries).
nameSpace: reactor
name: AgentGitCommit
version: 1.0.0
description: "AI-driven git commit: gathers repo context, consults the Reactor agent, executes the agent's decision."
tags: [dev, git, agent, ai, commit]
metadata:
  timeout: 300000
  retryPolicy:
    maxAttempts: 2
    backoffStrategy: linear
    initialDelay: 3000

inputs:
  workdir:
    type: string
    required: false
    description: "Absolute path of the git repository root. Defaults to the server process cwd."
  personaId:
    type: string
    required: false
    default: "GitGuardian"
    description: "Reactor AI persona to consult for the commit decision."
  hint:
    type: string
    required: false
    default: ""
    # Defaulting to "" ensures ${input.hint} resolves to an empty string when no
    # hint is supplied, instead of leaking the literal "${input.hint}" token into
    # the agent prompt (unresolved optional templates are passed through as-is).
    description: "Optional context hint for the agent (e.g. 'added unit tests for the payment module')."
  sessionId:
    type: string
    required: false
    description: "Resume an existing agent session. Useful for engine retries so the same conversation is reused."

steps:
  # ── 0. Resolve effective working directory ───────────────────────────────
  # input.workdir is optional.  When not provided, resolveTemplate leaves the
  # ${...} token intact; the node script detects this and falls back to
  # process.cwd() so downstream cli_command steps always receive a valid path.
  - id: resolveWorkdir
    type: cli_command
    config:
      command: "node"
      args:
        - "-e"
        - |
          const wd = process.env.WD;
          const effective = (wd && !wd.startsWith('${')) ? wd : process.cwd();
          process.stdout.write(effective);
      env:
        WD: "${input.workdir}"
      output:
        captureStdout: true
        captureStderr: false

  - id: setCwd
    type: set_variable
    dependsOn: resolveWorkdir
    config:
      action: set
      key: cwd
      source: step_output
      sourcePath: resolveWorkdir.outputs.stdout

  # ── 1. Gather git context (parallel) ─────────────────────────────────────
  - id: gatherContext
    type: parallel
    dependsOn: setCwd
    config:
      branches:
        - name: branch
          steps:
            - id: getBranch
              type: cli_command
              config:
                command: "git branch --show-current"
                cwd: "${variables.cwd}"
                failOnError: false
                expectedExitCodes: [0, 1]
                output:
                  captureStdout: true
                  captureStderr: false
        - name: status
          steps:
            - id: getStatus
              type: cli_command
              config:
                command: "git status --short"
                cwd: "${variables.cwd}"
                failOnError: false
                expectedExitCodes: [0, 1]
                output:
                  captureStdout: true
                  captureStderr: false
        - name: diffStat
          steps:
            - id: getDiffStat
              type: cli_command
              config:
                command: "git diff --stat"
                cwd: "${variables.cwd}"
                failOnError: false
                expectedExitCodes: [0, 1]
                output:
                  captureStdout: true
                  captureStderr: false
        - name: stagedStat
          steps:
            - id: getStagedStat
              type: cli_command
              config:
                command: "git diff --cached --stat"
                cwd: "${variables.cwd}"
                failOnError: false
                expectedExitCodes: [0, 1]
                output:
                  captureStdout: true
                  captureStderr: false
        - name: recentLog
          steps:
            - id: getRecentLog
              type: cli_command
              config:
                command: "git log --oneline -5"
                cwd: "${variables.cwd}"
                failOnError: false
                expectedExitCodes: [0, 1, 128]
                output:
                  captureStdout: true
                  captureStderr: false

  # ── 2. Consult the agent ──────────────────────────────────────────────────
  # Uses the GitGuardian persona's `commitDecisionPrompt` canned prompt for the
  # message, and constrains the response to a JSON schema via
  # providerConfig.structuredOutput — so the agent returns a guaranteed, valid
  # JSON decision object (no prose, no markdown fences, no regex extraction).
  - id: consultAgent
    type: agent_conversation
    dependsOn: gatherContext
    config:
      personaId: "${input.personaId}"
      sessionId: "${input.sessionId}"
      promptKey: commitDecisionPrompt
      promptVariables:
        branch: "${steps.getBranch.outputs.stdout}"
        recentLog: "${steps.getRecentLog.outputs.stdout}"
        status: "${steps.getStatus.outputs.stdout}"
        diffStat: "${steps.getDiffStat.outputs.stdout}"
        stagedStat: "${steps.getStagedStat.outputs.stdout}"
        hint: "${input.hint}"
      providerConfig:
        structuredOutput:
          name: git_decision
          strict: true
          schema:
            type: object
            additionalProperties: false
            required: [action, commitMessage, stashMessage, paths, reasoning]
            properties:
              action:
                type: string
                enum: [commit, add_and_commit, stash, abort]
              commitMessage:
                type: string
                description: "Imperative-mood summary, ≤72 chars. Required for commit / add_and_commit; empty string otherwise."
              stashMessage:
                type: string
                description: "Brief WIP description. Required for stash; empty string otherwise."
              paths:
                type: array
                items: { type: string }
                description: "Paths to stage; defaults to ['.']"
              reasoning:
                type: string
                description: "One-sentence justification for the chosen action."
      toolApprovalMode: auto
      promptMergeStrategy: append

  # ── 3. Normalise the agent's JSON decision ────────────────────────────────
  # Structured output guarantees `content` is a valid JSON object matching the
  # schema, so we parse it directly (no regex/markdown-fence handling) and only
  # apply defensive defaults for downstream steps.
  - id: parseDecision
    type: cli_command
    dependsOn: consultAgent
    config:
      command: "node"
      args:
        - "-e"
        - |
          const raw = process.env.AGENT_RESP_STRUCTURED || process.env.AGENT_RESP || '';
          let d;
          try { d = JSON.parse(raw); }
          catch (e) {
            process.stderr.write('Expected structured JSON from the agent but parse failed: ' + e.message + '\nAgent said:\n' + raw + '\n');
            process.exit(1);
          }
          const valid = ['commit','add_and_commit','stash','abort'];
          const action = valid.includes(d.action) ? d.action : 'abort';
          process.stdout.write(JSON.stringify({
            action,
            commitMessage: (d.commitMessage || 'chore: auto-commit').trim(),
            stashMessage:  (d.stashMessage  || 'WIP').trim(),
            paths:         Array.isArray(d.paths) && d.paths.length ? d.paths : ['.'],
            reasoning:     (d.reasoning     || '').trim()
          }));
      env:
        AGENT_RESP: "${steps.consultAgent.outputs.content}"
        AGENT_RESP_STRUCTURED: "${steps.consultAgent.outputs.structuredContent}"
      failOnError: true
      output:
        captureStdout: true
        captureStderr: true

  - id: logDecision
    type: log
    dependsOn: parseDecision
    config:
      level: info
      message: "Agent decision: ${steps.parseDecision.outputs.stdout}"

  # ── 4a. Abort ─────────────────────────────────────────────────────────────
  - id: ifAbort
    type: condition
    dependsOn: logDecision
    config:
      condition: "JSON.parse(steps.parseDecision.stdout).action === 'abort'"
      thenSteps:
        - id: logAbort
          type: log
          config:
            level: warn
            message: "Agent decided to abort — nothing meaningful to commit or stash."

  # ── 4b. Stash ─────────────────────────────────────────────────────────────
  - id: ifStash
    type: condition
    dependsOn: logDecision
    config:
      condition: "JSON.parse(steps.parseDecision.stdout).action === 'stash'"
      thenSteps:
        - id: extractStashMsg
          type: cli_command
          config:
            command: "node"
            args:
              - "-e"
              - "process.stdout.write(JSON.parse(process.env.D).stashMessage)"
            env:
              D: "${steps.parseDecision.outputs.stdout}"
            output:
              captureStdout: true
        - id: stashChanges
          type: cli_command
          dependsOn: extractStashMsg
          config:
            command: "git"
            args: ["stash", "push", "-u", "-m", "${steps.extractStashMsg.outputs.stdout}"]
            cwd: "${variables.cwd}"
            output:
              captureStdout: true
              captureStderr: true
        - id: logStash
          type: log
          dependsOn: stashChanges
          config:
            level: info
            message: "Changes stashed: ${steps.extractStashMsg.outputs.stdout}"

  # ── 4c. Stage and commit ──────────────────────────────────────────────────
  - id: ifAddAndCommit
    type: condition
    dependsOn: logDecision
    config:
      condition: "JSON.parse(steps.parseDecision.stdout).action === 'add_and_commit'"
      thenSteps:
        - id: extractAddCommitMsg
          type: cli_command
          config:
            command: "node"
            args:
              - "-e"
              - "process.stdout.write(JSON.parse(process.env.D).commitMessage)"
            env:
              D: "${steps.parseDecision.outputs.stdout}"
            output:
              captureStdout: true
        - id: stageFiles
          type: cli_command
          dependsOn: extractAddCommitMsg
          config:
            command: "git"
            args: ["add", "."]
            cwd: "${variables.cwd}"
        - id: commitAfterStage
          type: cli_command
          dependsOn: stageFiles
          config:
            command: "git"
            args: ["commit", "-m", "${steps.extractAddCommitMsg.outputs.stdout}"]
            cwd: "${variables.cwd}"
            output:
              captureStdout: true
              captureStderr: true
        - id: logAddAndCommit
          type: log
          dependsOn: commitAfterStage
          config:
            level: info
            message: "Staged and committed: ${steps.extractAddCommitMsg.outputs.stdout}"

  # ── 4d. Commit already-staged changes ────────────────────────────────────
  - id: ifCommit
    type: condition
    dependsOn: logDecision
    config:
      condition: "JSON.parse(steps.parseDecision.stdout).action === 'commit'"
      thenSteps:
        - id: extractCommitMsg
          type: cli_command
          config:
            command: "node"
            args:
              - "-e"
              - "process.stdout.write(JSON.parse(process.env.D).commitMessage)"
            env:
              D: "${steps.parseDecision.outputs.stdout}"
            output:
              captureStdout: true
        - id: commitStaged
          type: cli_command
          dependsOn: extractCommitMsg
          config:
            command: "git"
            args: ["commit", "-m", "${steps.extractCommitMsg.outputs.stdout}"]
            cwd: "${variables.cwd}"
            output:
              captureStdout: true
              captureStderr: true
        - id: logCommit
          type: log
          dependsOn: commitStaged
          config:
            level: info
            message: "Committed staged changes: ${steps.extractCommitMsg.outputs.stdout}"
