nameSpace: core
name: ProcessAITicket
version: 1.4.2
description: Autonomous AI engineering run for a SINGLE support ticket. Loads the ticket,
  moves it to in_progress, prepares an isolated git worktree on a ticket-keyed
  branch, has the nominated AI engineer agent perform the work, captures a
  structured completion report, has QualityQuinn review it and loops the engineer
  back in on rejection within a hard cycle bound. Once the review passes it
  commits, pushes and opens a pull request, raises a human approval task carrying
  the pull request link, polls GitHub every three minutes for the merge, and moves
  the ticket to resolved once the pull request is merged.
author: Reactor
tags:
  - ai
  - engineering
  - ticket
  - agent
  - review
  - signoff
  - core
  - automation
  - pull-request
metadata:
  # 12h. Must exceed the review loop plus the bounded merge poll (20 x 3min), or a
  # run is killed mid-poll and leaves a pull request nobody is watching.
  timeout: 43200000
  retryPolicy:
    maxAttempts: 1
    backoffStrategy: linear
    initialDelay: 5000

inputs:
  ticketId:
    type: string
    required: false
    description: The support ticket id to work on (one of ticketId / ticketReference).
  ticketReference:
    type: string
    required: false
    description: The human-readable ticket reference (alternative lookup key).
  agentId:
    type: string
    required: true
    description: The AI agent/persona id that will perform the engineering work
      (e.g. ReactorAIPersona).
  provider:
    type: string
    required: false
    description: Optional provider override for the engineer session.
  model:
    type: string
    required: false
    description: Optional model override for the engineer session.
  reviewerId:
    type: string
    required: false
    default: QualityQuinn
    description: The AI agent/persona id that reviews the engineering work.
  context:
    type: string
    required: false
    description: Optional additional context or instruction for the engineering agent.
  workdir:
    type: string
    required: false
    description: Absolute path of the git repository to work in. Defaults to the
      server process cwd.
  taskType:
    type: string
    required: false
    default: feature
    description: Branch prefix for the isolated worktree - feature, bug or chore.
      Used when the ticket's requestType does not map onto a prefix itself
      (bug -> bug, feature-request -> feature, documentation -> chore).
  oversightMode:
    type: string
    required: false
    default: auto
    description: auto (tools execute unattended) or supervised (risky tools raise
      approval tasks).
  maxReviewCycles:
    type: number
    required: false
    default: 3
    description: Hard bound on engineer/reviewer hand-back cycles before a human is asked.
  requireSignoff:
    type: boolean
    required: false
    default: true
    description: Raise a human approval task for the pull request (carrying the PR
      link) and poll for the merge. When false the run polls for the merge
      immediately after opening the pull request.

steps:
  # ── 0. Guard the inputs ─────────────────────────────────────────────────
  - id: guardInputs
    name: Guard inputs
    type: cli_command
    config:
      command: node
      args:
        - -e
        - >
          const TOK = '$' + '{';

          const unresolved = (v) => !v || String(v).includes(TOK);

          const id = String(process.env.TICKET_ID || '').trim();

          const ref = String(process.env.TICKET_REF || '').trim();

          const agent = String(process.env.AGENT_ID || '').trim();

          if (unresolved(agent)) {
            process.stderr.write('agentId is required: supply the AI agent/persona id (e.g. ReactorAIPersona).\n');
            process.exit(1);
          }

          if (unresolved(id) && unresolved(ref)) {
            process.stderr.write('One of ticketId or ticketReference is required.\n');
            process.exit(1);
          }

          process.stdout.write(JSON.stringify({ agentId: agent, ticketId: unresolved(id) ? null : id, ticketReference: unresolved(ref) ? null : ref }));
      env:
        TICKET_ID: ${input.ticketId}
        TICKET_REF: ${input.ticketReference}
        AGENT_ID: ${input.agentId}
      failOnError: true
      output:
        captureStdout: true
        captureStderr: true

  # ── 1. Load the ticket ──────────────────────────────────────────────────
  - id: loadTicket
    name: Load ticket
    type: service_invoke
    dependsOn: guardInputs
    config:
      service: core.ReactorySupportWorkflowService@1.0.0
      method: loadTicket
      params:
        id: ${input.ticketId}
        reference: ${input.ticketReference}

  # ── 2. Resolve run configuration ────────────────────────────────────────
  - id: resolveProvider
    name: Resolve provider override
    type: cli_command
    dependsOn: loadTicket
    config:
      command: node
      args:
        - -e
        - |
          const TOK = '$' + '{';
          const v = String(process.env.VALUE || '').trim();
          process.stdout.write(v.includes(TOK) ? '' : v);
      env:
        VALUE: ${input.provider}
      output:
        captureStdout: true

  - id: resolveModel
    name: Resolve model override
    type: cli_command
    dependsOn: resolveProvider
    config:
      command: node
      args:
        - -e
        - |
          const TOK = '$' + '{';
          const v = String(process.env.VALUE || '').trim();
          process.stdout.write(v.includes(TOK) ? '' : v);
      env:
        VALUE: ${input.model}
      output:
        captureStdout: true

  - id: resolveOversight
    name: Resolve oversight mode
    type: cli_command
    dependsOn: resolveModel
    config:
      command: node
      args:
        - -e
        - >
          const TOK = '$' + '{';

          const raw = String(process.env.MODE || '').trim().toLowerCase();

          const mode = raw.includes(TOK) ? 'auto' : raw;

          const toolApprovalMode = (mode === 'supervised' || mode === 'prompt') ? 'prompt' : 'auto';

          process.stdout.write(toolApprovalMode);
      env:
        MODE: ${input.oversightMode}
      output:
        captureStdout: true

  - id: resolveWorkdir
    name: Resolve working directory
    type: cli_command
    dependsOn: resolveOversight
    config:
      command: node
      args:
        - -e
        - |
          const TOK = '$' + '{';
          const wd = String(process.env.WD || '').trim();
          const effective = (wd && !wd.includes(TOK)) ? wd : process.cwd();
          process.stdout.write(effective);
      env:
        WD: ${input.workdir}
      output:
        captureStdout: true

  - id: resolveCycleBound
    name: Resolve review cycle bound
    type: cli_command
    dependsOn: resolveWorkdir
    config:
      command: node
      args:
        - -e
        - |
          const TOK = '$' + '{';
          const raw = String(process.env.BOUND || '').trim();
          const n = (raw && !raw.includes(TOK)) ? Number(raw) : NaN;
          const bound = Number.isFinite(n) && n > 0 ? Math.floor(n) : 3;
          process.stdout.write(String(bound));
      env:
        BOUND: ${input.maxReviewCycles}
      output:
        captureStdout: true

  - id: resolveSignoff
    name: Resolve signoff requirement
    type: cli_command
    dependsOn: resolveCycleBound
    config:
      command: node
      args:
        - -e
        - >
          const TOK = '$' + '{';

          const raw = String(process.env.REQ || '').trim().toLowerCase();

          const required = raw.includes(TOK) ? true : (raw === 'false' ? false : true);

          process.stdout.write(required ? 'true' : 'false');
      env:
        REQ: ${input.requireSignoff}
      output:
        captureStdout: true

  # ── 3. Seed per-run variables ───────────────────────────────────────────
  - id: setCycleBound
    name: Record review cycle bound
    type: set_variable
    dependsOn: resolveSignoff
    config:
      action: set
      key: reviewCycleBound
      source: step_output
      sourcePath: resolveCycleBound.outputs.stdout

  - id: seedSession
    name: Seed session variable
    type: set_variable
    dependsOn: setCycleBound
    config:
      action: set
      key: engineerSessionId
      value: ""

  - id: seedCycle
    name: Seed review cycle
    type: set_variable
    dependsOn: seedSession
    config:
      action: set
      key: reviewCycle
      value: 0

  - id: seedVerdict
    name: Seed review verdict
    type: set_variable
    dependsOn: seedCycle
    config:
      action: set
      key: reviewVerdict
      value: pending

  # Merge-poll and PR-approval state. Seeded here (not inline) so every branch
  # below can read the variables without depending on a step having run.
  - id: seedPrState
    name: Seed pull request state
    type: set_variable
    dependsOn: seedVerdict
    config:
      action: set
      key: prState
      value: unknown

  - id: seedPrPollCount
    name: Seed merge poll count
    type: set_variable
    dependsOn: seedPrState
    config:
      action: set
      key: prPollCount
      value: 0

  - id: seedPrApproved
    name: Seed pull request approval
    type: set_variable
    dependsOn: seedPrPollCount
    config:
      action: set
      key: prApproved
      value: "false"

  # ── 4. Guard the ticket ─────────────────────────────────────────────────
  - id: ticketGuard
    name: Ticket exists
    type: condition
    dependsOn: seedPrApproved
    config:
      condition: steps.loadTicket.result && steps.loadTicket.result.id
      thenSteps:
        - id: prepareWorktree
          name: Prepare isolated worktree
          type: cli_command
          config:
            command: node
            args:
              - -e
              - |
                const { execSync } = require('child_process');
                const fs = require('fs');
                const path = require('path');
                const TOK = '$' + '{';

                const cwd = String(process.env.CWD || '').trim();
                const ref = String(process.env.REF || '').trim();
                const requestType = String(process.env.REQUEST_TYPE || '').trim().toLowerCase();
                const taskType = (String(process.env.TASK_TYPE || 'feature').trim().toLowerCase() || 'feature');

                // The branch is keyed on the TICKET REFERENCE, so one ticket always maps to
                // exactly one branch. References carry '/' separators
                // (REACTORY-302016408/20261018/1674496462) which would split the ref name
                // into nested components, so every unsafe run is flattened to a single
                // dash. Case is preserved: the branch must still read as the ticket.
                //   bug/REACTORY-302016408-20261018-1674496462
                const rawRef = (ref && !ref.includes(TOK)) ? ref : 'ticket';
                const flatRef = String(rawRef).trim().replace(/[^A-Za-z0-9._-]+/g, '-').replace(/^[-.]+|[-.]+$/g, '') || 'ticket';

                // requestType decides the prefix where it maps onto a documented task
                // type; otherwise the taskType input (feature | bug | chore) applies.
                const PREFIX_BY_REQUEST_TYPE = {
                  bug: 'bug',
                  'bug-report': 'bug',
                  defect: 'bug',
                  feature: 'feature',
                  'feature-request': 'feature',
                  enhancement: 'feature',
                  chore: 'chore',
                  documentation: 'chore',
                  docs: 'chore',
                  refactor: 'chore',
                  maintenance: 'chore',
                };
                const prefix = (PREFIX_BY_REQUEST_TYPE[requestType] || taskType).replace(/[^a-z0-9-]+/g, '').replace(/^-+|-+$/g, '') || 'feature';
                const branch = prefix + '/' + flatRef;

                const worktreePath = path.resolve(cwd, '..', 'reactory-worktrees', 'ai-' + flatRef.toLowerCase());


                if (fs.existsSync(worktreePath)) {
                  fs.mkdirSync(path.join(worktreePath, '.ai-agent'), { recursive: true });
                  // A reused worktree reports the branch it is ACTUALLY on. Reporting the
                  // freshly computed name would aim the push and the pull request at a ref
                  // that does not exist.
                  let existing = '';
                  try {
                    existing = execSync('git rev-parse --abbrev-ref HEAD', { cwd: worktreePath, stdio: 'pipe' }).toString().trim();
                  } catch (e) {
                    existing = '';
                  }
                  process.stdout.write(JSON.stringify({
                    branch: existing || branch,
                    expectedBranch: branch,
                    worktreePath: worktreePath,
                    reused: true,
                    branchMismatch: !!(existing && existing !== branch),
                  }));
                  process.exit(0);
                }

                fs.mkdirSync(path.dirname(worktreePath), { recursive: true });

                try {
                  execSync('git worktree add "' + worktreePath + '" -b "' + branch + '"', { cwd: cwd, stdio: 'pipe' });
                } catch (e) {
                  // The branch may already exist from an earlier run whose worktree was pruned.
                  try {
                    execSync('git worktree add "' + worktreePath + '" "' + branch + '"', { cwd: cwd, stdio: 'pipe' });
                  } catch (e2) {
                    process.stderr.write('Failed to create worktree: ' + (e2 && e2.message ? e2.message : String(e2)) + '\n');
                    if (e2 && e2.stderr) process.stderr.write(String(e2.stderr) + '\n');
                    process.exit(1);
                  }
                }

                fs.mkdirSync(path.join(worktreePath, '.ai-agent'), { recursive: true });
                process.stdout.write(JSON.stringify({
                  branch: branch,
                  expectedBranch: branch,
                  worktreePath: worktreePath,
                  reused: false,
                  branchMismatch: false,
                }));
            env:
              CWD: ${steps.resolveWorkdir.outputs.stdout}
              REF: ${input.ticketReference || input.ticketId}
              REQUEST_TYPE: ${steps.loadTicket.result.requestType}
              TASK_TYPE: ${input.taskType}
            failOnError: true
            output:
              captureStdout: true
              captureStderr: true
        - id: readBranch
          name: Read branch name
          type: cli_command
          dependsOn: prepareWorktree
          config:
            command: node
            args:
              - -e
              - |
                const d = JSON.parse(process.env.WT || '{}');
                process.stdout.write(String(d.branch || ''));
            env:
              WT: ${steps.prepareWorktree.outputs.stdout}
            failOnError: true
            output:
              captureStdout: true
        - id: readWorktreePath
          name: Read worktree path
          type: cli_command
          dependsOn: readBranch
          config:
            command: node
            args:
              - -e
              - |
                const d = JSON.parse(process.env.WT || '{}');
                process.stdout.write(String(d.worktreePath || ''));
            env:
              WT: ${steps.prepareWorktree.outputs.stdout}
            failOnError: true
            output:
              captureStdout: true
        - id: logPickup
          name: Log pickup
          type: log
          dependsOn: readWorktreePath
          config:
            level: info
            message: AI agent '${input.agentId}' picking up
              ${steps.loadTicket.result.reference} in
              ${steps.readWorktreePath.outputs.stdout} on branch
              ${steps.readBranch.outputs.stdout}
        - id: pickupComment
          name: Comment pickup on ticket
          type: service_invoke
          dependsOn: logPickup
          config:
            service: core.ReactorySupportWorkflowService@1.0.0
            method: addComment
            params:
              ticketId: ${steps.loadTicket.result.id}
              comment: "AI engineering run started by agent '${input.agentId}' (reviewer:
                '${input.reviewerId}'). Working in an isolated worktree on
                branch ${steps.readBranch.outputs.stdout}. The ticket is in_progress;
                a pull request will be opened for human approval once the review
                passes, and the ticket moves to resolved when it is merged."
        - id: markInProgress
          name: Move ticket to in progress
          type: service_invoke
          dependsOn: pickupComment
          config:
            service: core.ReactorySupportWorkflowService@1.0.0
            method: updateStatus
            params:
              ticketId: ${steps.loadTicket.result.id}
              status: in_progress
              comment: Status moved to in_progress - AI engineering run started by agent
                '${input.agentId}' on branch ${steps.readBranch.outputs.stdout}.
        - id: engineer
          name: Engineering agent run
          type: agent_conversation
          dependsOn: markInProgress
          config:
            personaId: ${input.agentId}
            provider: ${steps.resolveProvider.outputs.stdout}
            model: ${steps.resolveModel.outputs.stdout}
            sessionId: ${variables.engineerSessionId}
            toolApprovalMode: auto
            maxToolIterations: 200
            promptMergeStrategy: append
            instructions: >-
              You are an autonomous software engineer working a real support
              ticket.

              You operate inside an ISOLATED git worktree that has been prepared for this ticket.

              The branch is throwaway and the work WILL be reviewed by a QA agent before it is

              accepted, so correctness and evidence matter more than speed.


              NON-NEGOTIABLE RULES

              1. Work ONLY inside the worktree directory given to you. Never touch any other checkout.

              2. Never commit, never push and never touch main, master or any protected branch.
                 The pipeline commits, pushes and opens the pull request for you.

              3. Read the relevant code before changing it, and match the surrounding conventions.

              4. After making a change you MUST run whatever verification exists (the project test
                 runner, a type check, or a targeted repro) and record the exact command and result.
                 A claim without a recorded command is not verification.
              5. You MUST finish by writing the completion report described below. This is how the
                 pipeline knows you are done. A run without a report is a failed run.

              COMPLETION CONTRACT

              Write a single JSON file to the exact path given to you as "REPORT PATH". REQUIREMENT: this object MUST have a TOP-LEVEL "status" field whose value is exactly one of "completed", "blocked" or "failed". It is the RUN status, NOT the ticket status - do not rename it, nest it, or omit it. The pipeline cannot proceed without it. Include every field below:

              {
                "status": "completed" | "blocked" | "failed",
                "summary": "one paragraph describing what you did and why",
                "changes": [{ "file": "path/relative/to/worktree", "description": "what changed" }],
                "testsRun": [{ "command": "exact command", "result": "passed" | "failed", "output": "trimmed output" }],
                "verification": "how you proved the change works",
                "risks": ["anything a reviewer should watch"],
                "followUps": ["work you deliberately left out of scope"],
                "branch": "the branch you worked on"
              }


              Use "completed" ONLY if you made the change and verified it.

              Use "blocked" if you cannot proceed without human input or missing information -

              stop immediately and say precisely what you need.

              Use "failed" if you attempted the work and could not make it pass.

              Do NOT keep retrying indefinitely; when you are stuck, write the report with the

              honest status and stop.


              If you are asked to revise (a reviewer sent findings back), address EVERY required

              change, re-run your verification, and REWRITE the report file with the updated evidence.


              Finish with a short plain-text summary of the outcome. Do not wrap your whole reply

              in a code fence.
            message: >-
              Work the following support ticket.


              ## Ticket

              - Reference: ${steps.loadTicket.result.reference}

              - Request: ${steps.loadTicket.result.request}

              - Type: ${steps.loadTicket.result.requestType}

              - Priority: ${steps.loadTicket.result.priority}

              - Status: ${steps.loadTicket.result.status}

              - Description:

              ${steps.loadTicket.result.description}


              ## Your working environment

              - WORKTREE (do all work here): ${steps.readWorktreePath.outputs.stdout}

              - BRANCH: ${steps.readBranch.outputs.stdout}

              - REPORT PATH (write your completion report here): ${steps.readWorktreePath.outputs.stdout}/.ai-agent/report.json


              ## Additional context / instruction

              ${input.context || 'No additional context or instruction supplied.'}


              Now: inspect the repository, implement the fix or feature the ticket describes,

              verify it, and write the completion report to REPORT PATH. Then summarise the outcome.
        - id: setEngineerSession
          name: Capture engineer session id
          type: set_variable
          dependsOn: engineer
          config:
            action: set
            key: engineerSessionId
            source: step_output
            sourcePath: engineer.outputs.sessionId
        - id: captureReport
          name: Capture completion report
          type: cli_command
          dependsOn: setEngineerSession
          config:
            command: node
            args:
              - -e
              - >
                const fs = require('fs');

                const path = require('path');

                const wt = String(process.env.WT || '').trim();

                const p = path.join(wt, '.ai-agent', 'report.json');

                const warnings = [];

                // Never hard-fail: a non-zero exit hides the cause (the engine records only

                // 'Command failed with exit code 1') and burns a retry. Emit a structured

                // result and let the workflow branch on it instead.

                if (!fs.existsSync(p)) {
                  process.stdout.write(JSON.stringify({ usable: false, missing: true, path: p, warnings: ['report.json not found'] }));
                  process.exit(0);
                }

                let report;

                try { report = JSON.parse(fs.readFileSync(p, 'utf8')); }

                catch (e) {
                  process.stdout.write(JSON.stringify({ usable: false, parseError: String(e && e.message), path: p, warnings: ['report is not valid JSON'] }));
                  process.exit(0);
                }

                if (!report || typeof report !== 'object' || Array.isArray(report)) {
                  process.stdout.write(JSON.stringify({ usable: false, parseError: 'not an object', path: p, warnings: ['report is not an object'] }));
                  process.exit(0);
                }

                // The agent's report shape DRIFTS between runs, so no field may be a hard

                // requirement; only presence + parseability are fatal-equivalent.

                const pick = (...names) => { for (const n of names) { const v = report[n]; if (typeof v === 'string' && v.trim()) return v.trim(); } return null; };

                let summary = pick('summary', 'resolution', 'outcome', 'description', 'result', 'overview', 'conclusion');

                if (!summary && Array.isArray(report.changes) && report.changes.length > 0) summary = 'No summary field supplied; report lists ' + report.changes.length + ' change(s).';

                if (!summary) { summary = 'No summary field supplied and no changes listed.'; warnings.push('no summary-like field'); }

                const allowed = ['completed', 'blocked', 'failed'];

                let status = allowed.indexOf(String(report.status)) !== -1 ? String(report.status) : null;

                let statusSource = status ? 'report.status' : null;

                if (!status) {
                  const t = String((report.ticket && (report.ticket.status || report.ticket.status_after)) || '').toLowerCase();
                  const m = { resolved: 'completed', complete: 'completed', completed: 'completed', done: 'completed', blocked: 'blocked', failed: 'failed', open: 'in_progress', in_progress: 'in_progress', new: 'in_progress' };
                  if (m[t]) { status = m[t]; statusSource = 'report.ticket.status=' + t; }
                }

                if (!status && Array.isArray(report.changes) && report.changes.length > 0) { status = 'completed'; statusSource = 'inferred:non-empty changes'; }

                if (!status) { status = 'blocked'; statusSource = 'default:no signal'; }

                const out = Object.assign({}, report, { summary: summary, status: status, statusSource: statusSource, usable: true });

                if (warnings.length) out.contractWarnings = warnings;

                process.stdout.write(JSON.stringify(out));

                process.exit(0);
            env:
              WT: ${steps.readWorktreePath.outputs.stdout}
            failOnError: false
            output:
              captureStdout: true
              captureStderr: true
        - id: readReportStatus
          name: Read report status
          type: cli_command
          dependsOn: captureReport
          config:
            command: node
            args:
              - -e
              - >
                const fs = require('fs');

                const path = require('path');

                const wt = String(process.env.WT || '').trim();

                const p = path.join(wt, '.ai-agent', 'report.json');

                // Read the report FILE directly. Chaining the full report through the previous

                // step's stdout (a multi-KB env var) proved brittle; the file is the source of truth.

                let status = '';

                try {
                  const r = JSON.parse(fs.readFileSync(p, 'utf8'));
                  const allowed = ['completed', 'blocked', 'failed'];
                  if (allowed.indexOf(String(r.status)) !== -1) { status = String(r.status); }
                  else {
                    const t = String((r.ticket && (r.ticket.status || r.ticket.status_after)) || '').toLowerCase();
                    const m = { resolved: 'completed', complete: 'completed', completed: 'completed', done: 'completed', blocked: 'blocked', failed: 'failed', open: 'in_progress', in_progress: 'in_progress', new: 'in_progress' };
                    status = m[t] || (Array.isArray(r.changes) && r.changes.length > 0 ? 'completed' : '');
                  }
                } catch (e) { status = ''; }

                process.stdout.write(status);
            env:
              WT: ${steps.readWorktreePath.outputs.stdout}
            failOnError: false
            output:
              captureStdout: true
              captureStderr: true
        - id: reportBranch
          name: Report outcome
          type: condition
          dependsOn: readReportStatus
          config:
            condition: steps.readReportStatus.stdout === 'completed'
            thenSteps:
              - id: diffstat
                name: Collect change evidence
                type: cli_command
                config:
                  command: node
                  args:
                    - -e
                    - >
                      const { execSync } = require('child_process');

                      const wt = String(process.env.WT || '').trim();

                      let out = '';

                      try {
                        out = execSync('git diff --stat HEAD', { cwd: wt, stdio: 'pipe' }).toString().trim();
                      } catch (e) {
                        out = 'unable to compute diffstat: ' + (e && e.message ? e.message : String(e));
                      }

                      process.stdout.write(out || 'no changes detected in the worktree');
                  env:
                    WT: ${steps.readWorktreePath.outputs.stdout}
                  failOnError: false
                  output:
                    captureStdout: true
              - id: reviewLoop
                name: Review loop
                type: while
                dependsOn: diffstat
                config:
                  condition: variables.reviewVerdict !== 'approved' &&
                    Number(variables.reviewCycle) <
                    Number(variables.reviewCycleBound)
                  steps:
                    - id: review
                      name: Reviewer agent run
                      type: agent_conversation
                      config:
                        personaId: ${input.reviewerId}
                        toolApprovalMode: auto
                        maxToolIterations: 150
                        promptMergeStrategy: append
                        instructions: >-
                          You are the independent quality reviewer for an AI
                          engineering run.

                          You did NOT write this code. Your job is to falsify it, not to approve it.


                          You have the engineer's self-reported completion report and the change

                          evidence. Treat the report as a CLAIM, never as proof.


                          METHOD

                          1. Read the actual changed files in the worktree. Confirm the changes exist
                             and match what the report claims.
                          2. Independently decide whether the change actually addresses the ticket.

                          3. Run the relevant tests / type checks YOURSELF and observe the real result.
                             Do not accept the engineer's recorded output at face value.
                          4. Look specifically for: silently weakened or skipped assertions,
                             tests that pass without exercising the change, hardcoded values that
                             fake a fix, unhandled error paths, and regressions elsewhere.
                          5. Approve ONLY if you independently verified the change works and the
                             ticket's requirement is genuinely met.

                          You MUST finish by writing your verdict as a JSON file to the exact path

                          given to you as "REVIEW PATH":

                          {
                            "verdict": "approved" | "rejected",
                            "confidence": 0.0,
                            "findings": ["what you actually observed"],
                            "requiredChanges": ["precise, actionable changes the engineer must make"],
                            "evidence": "the exact commands you ran and what they returned"
                          }


                          If you reject, every entry in requiredChanges must be specific enough that

                          the engineer can act on it without asking you a question.

                          Finish with a short plain-text summary. Do not wrap your whole reply in a

                          code fence.
                        message: >-
                          Review the following AI engineering run.


                          ## Ticket under work

                          - Reference: ${steps.loadTicket.result.reference}

                          - Request: ${steps.loadTicket.result.request}

                          - Type: ${steps.loadTicket.result.requestType}

                          - Description:

                          ${steps.loadTicket.result.description}


                          ## Worktree to inspect

                          ${steps.readWorktreePath.outputs.stdout}


                          ## Change evidence (diffstat)

                          ${steps.diffstat.outputs.stdout}


                          ## Engineer's completion report (a CLAIM - verify it)

                          Read the CURRENT report yourself - it is rewritten after each revision, so

                          always read it from disk rather than trusting a cached copy:

                          ${steps.readWorktreePath.outputs.stdout}/.ai-agent/report.json


                          ## Review cycle

                          This is review cycle ${variables.reviewCycle} of at most ${steps.resolveCycleBound.outputs.stdout}.


                          ## Your output

                          Write your verdict JSON to REVIEW PATH:

                          ${steps.readWorktreePath.outputs.stdout}/.ai-agent/review.json
                    - id: captureReview
                      name: Capture review verdict
                      type: cli_command
                      dependsOn: review
                      config:
                        command: node
                        args:
                          - -e
                          - >
                            const fs = require('fs');

                            const path = require('path');

                            const wt = String(process.env.WT || '').trim();

                            const p = path.join(wt, '.ai-agent', 'review.json');

                            // The reviewer's verdict shape DRIFTS: it may be top-level or nested under

                            // 'review', and the verdict may be spelled verdict/decision with PASS/FAIL.

                            // Accept all of them rather than hard-failing on one expected shape.

                            if (!fs.existsSync(p)) { process.stdout.write(JSON.stringify({ verdict: 'rejected', parseError: 'review.json not found', requiredChanges: ['The reviewer produced no verdict file.'] })); process.exit(0); }

                            let raw; try { raw = JSON.parse(fs.readFileSync(p, 'utf8')); } catch (e) { process.stdout.write(JSON.stringify({ verdict: 'rejected', parseError: String(e && e.message), requiredChanges: ['The reviewer verdict file is not valid JSON.'] })); process.exit(0); }

                            const rv = (raw && typeof raw.review === 'object' && raw.review) ? raw.review : raw;

                            const norm = String((rv && (rv.verdict || rv.decision)) || raw.verdict || '').trim().toLowerCase();

                            let verdict = '';

                            if (['approved', 'approve', 'pass', 'passed', 'accept', 'accepted', 'ok'].indexOf(norm) !== -1) verdict = 'approved';

                            else if (['rejected', 'reject', 'fail', 'failed', 'declined', 'changes_requested', 'changes-requested', 'request_changes', 'needs_changes', 'needs_work'].indexOf(norm) !== -1) verdict = 'rejected';

                            let changes = (rv && rv.requiredChanges) || raw.requiredChanges || [];

                            if (!Array.isArray(changes)) changes = [String(changes)];

                            if (!verdict) { verdict = 'rejected'; changes = changes.concat(['The reviewer verdict was not recognisable (raw: ' + norm + '). Treating as rejected.']); }

                            if (verdict === 'rejected' && changes.length === 0) changes = ['The reviewer rejected the work but listed no specific required changes; re-check the review report at .ai-agent/review.json.'];

                            const summary = String((rv && (rv.verdictSummary || rv.summary || rv.reason)) || raw.verdictSummary || raw.summary || '').slice(0, 4000);

                            process.stdout.write(JSON.stringify({ verdict: verdict, verdictSource: norm, requiredChanges: changes, summary: summary, reviewPath: p }));

                            process.exit(0);
                        env:
                          WT: ${steps.readWorktreePath.outputs.stdout}
                        failOnError: false
                        output:
                          captureStdout: true
                          captureStderr: true
                    - id: readVerdict
                      name: Read verdict
                      type: cli_command
                      dependsOn: captureReview
                      config:
                        command: node
                        args:
                          - -e
                          - |
                            // Read review.json from disk. The previous form passed the whole
                            // captured verdict through an env var, which broke on a multi-KB
                            // payload. The file is the source of truth and is already
                            // normalised by captureReview, so prefer it and only fall back to
                            // the step output when the file is gone.
                            const fs = require('fs');
                            const path = require('path');
                            const wt = String(process.env.WT || '').trim();
                            const fallback = String(process.env.REVIEW || '').trim();

                            const normalise = (raw) => {
                              const rv = (raw && typeof raw.review === 'object' && raw.review) ? raw.review : raw;
                              const norm = String((rv && (rv.verdict || rv.decision)) || (raw && raw.verdict) || '').trim().toLowerCase();
                              if (['approved', 'approve', 'pass', 'passed', 'accept', 'accepted', 'ok'].indexOf(norm) !== -1) return 'approved';
                              return 'rejected';
                            };

                            try {
                              const p = path.join(wt, '.ai-agent', 'review.json');
                              if (fs.existsSync(p)) {
                                process.stdout.write(normalise(JSON.parse(fs.readFileSync(p, 'utf8'))));
                                process.exit(0);
                              }
                            } catch (e) { /* fall through */ }

                            try {
                              process.stdout.write(normalise(JSON.parse(fallback)));
                            } catch (e) {
                              process.stdout.write('rejected');
                            }
                        env:
                          WT: ${steps.readWorktreePath.outputs.stdout}
                          REVIEW: ${steps.captureReview.outputs.stdout}
                        failOnError: false
                        output:
                          captureStdout: true
                          captureStderr: true
                    - id: setVerdict
                      name: Record verdict
                      type: set_variable
                      dependsOn: readVerdict
                      config:
                        action: set
                        key: reviewVerdict
                        source: step_output
                        sourcePath: readVerdict.outputs.stdout
                    - id: bumpCycle
                      name: Increment review cycle
                      type: cli_command
                      dependsOn: setVerdict
                      config:
                        command: node
                        args:
                          - -e
                          - >
                            const n = Number(String(process.env.CYCLE ||
                            '0').trim());

                            process.stdout.write(String((Number.isFinite(n) ? n : 0) + 1));
                        env:
                          CYCLE: ${variables.reviewCycle}
                        failOnError: true
                        output:
                          captureStdout: true
                    - id: setCycle
                      name: Record review cycle
                      type: set_variable
                      dependsOn: bumpCycle
                      config:
                        action: set
                        key: reviewCycle
                        source: step_output
                        sourcePath: bumpCycle.outputs.stdout
                    - id: verdictBranch
                      name: Act on verdict
                      type: condition
                      dependsOn: setCycle
                      config:
                        condition: variables.reviewVerdict === 'rejected'
                        thenSteps:
                          - id: handBack
                            name: Hand findings back to engineer
                            type: agent_conversation
                            config:
                              personaId: ${input.agentId}
                              provider: ${steps.resolveProvider.outputs.stdout}
                              model: ${steps.resolveModel.outputs.stdout}
                              sessionId: ${variables.engineerSessionId}
                              toolApprovalMode: auto
                              maxToolIterations: 200
                              promptMergeStrategy: append
                              message: >-
                                The reviewer REJECTED your work. You must fix
                                it.


                                ## Reviewer verdict

                                ${steps.captureReview.outputs.stdout}


                                ## Instructions

                                1. Address EVERY required change listed above. Do not cherry-pick.

                                2. Re-run your verification after the changes.

                                3. REWRITE the completion report at:
                                   ${steps.readWorktreePath.outputs.stdout}/.ai-agent/report.json
                                   with the updated evidence (real command output, not a summary).
                                4. If a required change is genuinely wrong or impossible, say so explicitly in
                                   the report's risks and explain why - do not silently ignore it.

                                Work only inside the worktree. Never push.
                          - id: reCaptureReport
                            name: Re-capture completion report
                            type: cli_command
                            dependsOn: handBack
                            config:
                              command: node
                              args:
                                - -e
                                - >
                                  const fs = require('fs');

                                  const path = require('path');

                                  const wt = String(process.env.WT || '').trim();

                                  const p = path.join(wt, '.ai-agent', 'report.json');

                                  const warnings = [];

                                  // Never hard-fail: a non-zero exit hides the cause (the engine records only

                                  // 'Command failed with exit code 1') and burns a retry. Emit a structured

                                  // result and let the workflow branch on it instead.

                                  if (!fs.existsSync(p)) {
                                    process.stdout.write(JSON.stringify({ usable: false, missing: true, path: p, warnings: ['report.json not found'] }));
                                    process.exit(0);
                                  }

                                  let report;

                                  try { report = JSON.parse(fs.readFileSync(p, 'utf8')); }

                                  catch (e) {
                                    process.stdout.write(JSON.stringify({ usable: false, parseError: String(e && e.message), path: p, warnings: ['report is not valid JSON'] }));
                                    process.exit(0);
                                  }

                                  if (!report || typeof report !== 'object' || Array.isArray(report)) {
                                    process.stdout.write(JSON.stringify({ usable: false, parseError: 'not an object', path: p, warnings: ['report is not an object'] }));
                                    process.exit(0);
                                  }

                                  // The agent's report shape DRIFTS between runs, so no field may be a hard

                                  // requirement; only presence + parseability are fatal-equivalent.

                                  const pick = (...names) => { for (const n of names) { const v = report[n]; if (typeof v === 'string' && v.trim()) return v.trim(); } return null; };

                                  let summary = pick('summary', 'resolution', 'outcome', 'description', 'result', 'overview', 'conclusion');

                                  if (!summary && Array.isArray(report.changes) && report.changes.length > 0) summary = 'No summary field supplied; report lists ' + report.changes.length + ' change(s).';

                                  if (!summary) { summary = 'No summary field supplied and no changes listed.'; warnings.push('no summary-like field'); }

                                  const allowed = ['completed', 'blocked', 'failed'];

                                  let status = allowed.indexOf(String(report.status)) !== -1 ? String(report.status) : null;

                                  let statusSource = status ? 'report.status' : null;

                                  if (!status) {
                                    const t = String((report.ticket && (report.ticket.status || report.ticket.status_after)) || '').toLowerCase();
                                    const m = { resolved: 'completed', complete: 'completed', completed: 'completed', done: 'completed', blocked: 'blocked', failed: 'failed', open: 'in_progress', in_progress: 'in_progress', new: 'in_progress' };
                                    if (m[t]) { status = m[t]; statusSource = 'report.ticket.status=' + t; }
                                  }

                                  if (!status && Array.isArray(report.changes) && report.changes.length > 0) { status = 'completed'; statusSource = 'inferred:non-empty changes'; }

                                  if (!status) { status = 'blocked'; statusSource = 'default:no signal'; }

                                  const out = Object.assign({}, report, { summary: summary, status: status, statusSource: statusSource, usable: true });

                                  if (warnings.length) out.contractWarnings = warnings;

                                  process.stdout.write(JSON.stringify(out));

                                  process.exit(0);
                              env:
                                WT: ${steps.readWorktreePath.outputs.stdout}
                              failOnError: false
                              output:
                                captureStdout: true
                                captureStderr: true
                          - id: reReadReportStatus
                            name: Re-read report status
                            type: cli_command
                            dependsOn: reCaptureReport
                            config:
                              command: node
                              args:
                                - -e
                                - |
                                  // Read the report FILE directly. Passing the whole captured report
                                  // through an env var failed on a real 20KB revision report, which
                                  // terminated the run at this step and made a rejected review
                                  // unrecoverable. The file is the source of truth, and 'not
                                  // completed' must be a VALUE here, not a thrown error.
                                  const fs = require('fs');
                                  const path = require('path');
                                  const wt = String(process.env.WT || '').trim();
                                  const p = path.join(wt, '.ai-agent', 'report.json');

                                  let status = '';
                                  try {
                                    const r = JSON.parse(fs.readFileSync(p, 'utf8'));
                                    const allowed = ['completed', 'blocked', 'failed'];
                                    if (allowed.indexOf(String(r.status)) !== -1) {
                                      status = String(r.status);
                                    } else {
                                      const t = String((r.ticket && (r.ticket.status || r.ticket.status_after)) || '').toLowerCase();
                                      const m = { resolved: 'completed', complete: 'completed', completed: 'completed', done: 'completed', blocked: 'blocked', failed: 'failed', open: 'in_progress', in_progress: 'in_progress', new: 'in_progress' };
                                      status = m[t] || (Array.isArray(r.changes) && r.changes.length > 0 ? 'completed' : '');
                                    }
                                  } catch (e) {
                                    status = '';
                                  }

                                  process.stdout.write(status);
                              env:
                                WT: ${steps.readWorktreePath.outputs.stdout}
                              failOnError: false
                              output:
                                captureStdout: true
                                captureStderr: true
                          - id: reReportBranch
                            name: Did the revision complete
                            type: condition
                            dependsOn: reReadReportStatus
                            config:
                              condition: steps.reReadReportStatus.stdout === 'completed'
                              thenSteps:
                                - id: logRevisionComplete
                                  name: Log revision complete
                                  type: log
                                  config:
                                    level: info
                                    message: Revision cycle ${variables.reviewCycle} completed for
                                      ${steps.loadTicket.result.reference} -
                                      re-reviewing.
                              elseSteps:
                                - id: logRevisionBlocked
                                  name: Log revision blocked
                                  type: log
                                  config:
                                    level: warn
                                    message: Revision cycle ${variables.reviewCycle} did NOT complete (status
                                      '${steps.reReadReportStatus.outputs.stdout}')
                                      for ${steps.loadTicket.result.reference}.
                        elseSteps:
                          - id: logApproved
                            name: Log reviewer approval
                            type: log
                            config:
                              level: info
                              message: Reviewer APPROVED ${steps.loadTicket.result.reference} on review cycle
                                ${variables.reviewCycle}.
              - id: outcome
                name: Loop outcome
                type: condition
                dependsOn: reviewLoop
                config:
                  condition: variables.reviewVerdict === 'approved'
                  thenSteps:
                    - id: acceptedLog
                      name: Log accepted
                      type: log
                      config:
                        level: info
                        message: AI run ACCEPTED for ${steps.loadTicket.result.reference} - branch
                          ${steps.readBranch.outputs.stdout} after
                          ${variables.reviewCycle} review cycle(s).
                    - id: acceptedComment
                      name: Comment acceptance on ticket
                      type: service_invoke
                      dependsOn: acceptedLog
                      config:
                        service: core.ReactorySupportWorkflowService@1.0.0
                        method: addComment
                        params:
                          ticketId: ${steps.loadTicket.result.id}
                          comment: AI engineering run reviewed and ACCEPTED after ${variables.reviewCycle}
                            review cycle(s). Publishing branch
                            ${steps.readBranch.outputs.stdout} and opening a pull
                            request for human approval.

                    # ── Publish the reviewed work ─────────────────────────────────
                    - id: commitChanges
                      name: Commit worktree changes
                      type: cli_command
                      dependsOn: acceptedComment
                      config:
                        command: node
                        args:
                          - -e
                          - |
                            const { execSync } = require('child_process');
                            const wt = String(process.env.WT || '').trim();
                            const ref = String(process.env.REF || '').trim();
                            const run = (cmd) => execSync(cmd, { cwd: wt, stdio: 'pipe' }).toString();

                            let dirty = '';
                            // The agent is told never to commit, but it sometimes does. If so, the run
                            // artifacts are already in the branch and pushBranch would publish them.
                            // Untrack them here; the tip then carries no .ai-agent content and the PR
                            // diff collapses to the real work.
                            let internal = '';
                            try { internal = run('git ls-files .ai-agent').trim(); } catch (e) { internal = ''; }
                            if (internal) {
                              try { run('git rm -r --cached --quiet .ai-agent'); } catch (e) { /* best effort */ }
                            }
                            try {
                              dirty = run('git status --porcelain -- . ":(exclude).ai-agent"');
                            } catch (e) {
                              process.stderr.write('git status failed: ' + (e && e.message ? e.message : String(e)) + '\n');
                              process.exit(1);
                            }
                            if (!dirty.trim() && !internal) {
                              process.stdout.write(JSON.stringify({ committed: false, reason: 'worktree clean' }));
                              process.exit(0);
                            }

                            // A headless server may have no git identity configured; a commit
                            // must not fail for that reason alone.
                            let email = '';
                            try { email = run('git config user.email').trim(); } catch (e) { email = ''; }
                            const identity = email ? '' : ' -c user.name="Reactory AI" -c user.email="ai@reactory.net"';
                            const safe = ('AI engineering run: ' + ref).replace(/["'`$\\]/g, ' ');

                            try {
                              // The pipeline writes .ai-agent/report.json and review.json into
                              // the worktree and no target repository gitignores that path, so
                              // a bare 'git add -A' would publish run internals in the pull
                              // request. Exclude it here rather than editing the repo's
                              // .git/info/exclude, which is shared with the main checkout.
                              execSync('git add -A -- . ":(exclude).ai-agent" && git commit' + identity + " -m '" + safe + "'", { cwd: wt, stdio: 'pipe' });
                            } catch (e) {
                              process.stderr.write('git commit failed: ' + (e && e.message ? e.message : String(e)) + '\n');
                              if (e && e.stderr) process.stderr.write(String(e.stderr) + '\n');
                              process.exit(1);
                            }

                            process.stdout.write(JSON.stringify({
                              committed: true,
                              sha: run('git rev-parse HEAD').trim(),
                            }));
                        env:
                          WT: ${steps.readWorktreePath.outputs.stdout}
                          REF: ${steps.loadTicket.result.reference}
                        failOnError: false
                        timeout: 300000
                        output:
                          captureStdout: true
                          captureStderr: true

                    - id: pushBranch
                      name: Push branch to origin
                      type: cli_command
                      dependsOn: commitChanges
                      config:
                        command: node
                        args:
                          - -e
                          - |
                            const { execSync } = require('child_process');
                            const wt = String(process.env.WT || '').trim();
                            const branch = String(process.env.BRANCH || '').trim();
                            const run = (cmd) => execSync(cmd, { cwd: wt, stdio: 'pipe' }).toString();
                            const done = (o) => { process.stdout.write(JSON.stringify(o)); process.exit(0); };

                            if (!branch) done({ ok: false, error: 'no branch resolved for the worktree' });

                            let remote = '';
                            try { remote = run('git remote get-url origin').trim(); } catch (e) { remote = ''; }
                            if (!remote) done({ ok: false, error: 'the worktree repository has no "origin" remote' });

                            try {
                              run('git push --set-upstream origin "' + branch + '"');
                            } catch (e) {
                              const detail = [
                                e && e.stderr ? String(e.stderr).trim() : '',
                                e && e.message ? e.message : String(e),
                              ].filter(Boolean).join(' | ');
                              done({ ok: false, error: 'git push failed: ' + detail.slice(0, 1500), branch: branch, remote: remote });
                            }

                            done({ ok: true, branch: branch, remote: remote });
                        env:
                          WT: ${steps.readWorktreePath.outputs.stdout}
                          BRANCH: ${steps.readBranch.outputs.stdout}
                        failOnError: false
                        timeout: 600000
                        output:
                          captureStdout: true
                          captureStderr: true

                    - id: createPullRequest
                      name: Create pull request
                      type: cli_command
                      dependsOn: pushBranch
                      config:
                        command: node
                        args:
                          - -e
                          - |
                            const fs = require('fs');
                            const path = require('path');
                            const { execSync } = require('child_process');

                            const wt = String(process.env.WT || '').trim();
                            const branch = String(process.env.BRANCH || '').trim();
                            const ref = String(process.env.REF || '').trim();
                            const request = String(process.env.REQUEST || '').trim();
                            const cycles = String(process.env.CYCLES || '').trim();
                            const reviewer = String(process.env.REVIEWER || '').trim();
                            const run = (cmd) => execSync(cmd, { cwd: wt, stdio: 'pipe' }).toString();
                            const done = (o) => { process.stdout.write(JSON.stringify(o)); process.exit(0); };

                            // Base branch - origin/HEAD is authoritative, then gh, then master.
                            let base = '';
                            try {
                              base = run('git symbolic-ref --short refs/remotes/origin/HEAD').trim().replace(/^origin\//, '');
                            } catch (e) {
                              base = '';
                            }
                            if (!base) {
                              try { base = run('gh repo view --json defaultBranchRef -q .defaultBranchRef.name').trim(); } catch (e) { base = ''; }
                            }
                            if (!base) base = 'master';

                            let report = {};
                            try {
                              report = JSON.parse(fs.readFileSync(path.join(wt, '.ai-agent', 'report.json'), 'utf8'));
                            } catch (e) {
                              report = {};
                            }
                            const text = (v) => (typeof v === 'string' ? v.trim() : '');
                            const list = (v) => (Array.isArray(v) ? v : []);

                            const lines = [];
                            lines.push('## AI engineering run');
                            lines.push('');
                            lines.push('Ticket: ' + ref);
                            if (request) lines.push('Request: ' + request);
                            lines.push('');
                            lines.push('### Summary');
                            lines.push(text(report.summary) || 'No summary supplied by the engineer.');

                            const changes = list(report.changes);
                            if (changes.length) {
                              lines.push('');
                              lines.push('### Changes');
                              changes.forEach((c) => {
                                if (typeof c === 'string') lines.push('- ' + c);
                                else if (c && (c.file || c.description)) lines.push('- `' + String(c.file || '') + '` ' + String(c.description || ''));
                              });
                            }

                            const tests = list(report.testsRun);
                            if (tests.length) {
                              lines.push('');
                              lines.push('### Verification');
                              tests.forEach((t) => {
                                if (typeof t === 'string') lines.push('- ' + t);
                                else if (t) lines.push('- `' + String(t.command || '') + '` -> ' + String(t.result || 'unknown'));
                              });
                            }
                            if (text(report.verification)) {
                              lines.push('');
                              lines.push(text(report.verification));
                            }

                            const risks = list(report.risks);
                            if (risks.length) {
                              lines.push('');
                              lines.push('### Risks');
                              risks.forEach((r) => lines.push('- ' + String(r)));
                            }

                            lines.push('');
                            lines.push('### Review');
                            lines.push('Approved by ' + (reviewer || 'the reviewing agent') + ' after ' + (cycles || '0') + ' review cycle(s).');
                            lines.push('');
                            lines.push('---');
                            lines.push('Generated by core.ProcessAITicket@1.4.2');

                            const bodyFile = path.join(wt, '.ai-agent', 'pr-body.md');
                            fs.writeFileSync(bodyFile, lines.join('\n'), 'utf8');

                            const title = (ref + (request ? ' - ' + request : '')).slice(0, 140);
                            let url = '';
                            try {
                              url = run('gh pr create --base "' + base + '" --head "' + branch + '" --title "' + title.replace(/["`$\\]/g, ' ') + '" --body-file "' + bodyFile + '"').trim();
                            } catch (e) {
                              const detail = [
                                e && e.stderr ? String(e.stderr).trim() : '',
                                e && e.message ? e.message : String(e),
                              ].filter(Boolean).join(' | ');

                              // A pull request for this branch may already exist (run retry).
                              if (/already exists/i.test(detail)) {
                                try {
                                  const view = JSON.parse(run('gh pr view "' + branch + '" --json url,number,state,mergedAt'));
                                  done({ ok: true, created: false, prUrl: view.url, prNumber: view.number, state: view.state, base: base, branch: branch });
                                } catch (e2) {
                                  done({ ok: false, error: 'pull request exists but could not be inspected - ' + String(e2 && e2.message ? e2.message : e2), base: base, branch: branch });
                                }
                              }
                              done({ ok: false, error: 'gh pr create failed: ' + detail.slice(0, 1500), base: base, branch: branch });
                            }

                            // Normalise to a structured record rather than scraping the URL line.
                            try {
                              const view = JSON.parse(run('gh pr view "' + branch + '" --json url,number,state,mergedAt'));
                              done({ ok: true, created: true, prUrl: view.url || url, prNumber: view.number, state: view.state, base: base, branch: branch });
                            } catch (e) {
                              done({ ok: !!url, created: true, prUrl: url, prNumber: null, state: 'OPEN', base: base, branch: branch });
                            }
                        env:
                          WT: ${steps.readWorktreePath.outputs.stdout}
                          BRANCH: ${steps.readBranch.outputs.stdout}
                          REF: ${steps.loadTicket.result.reference}
                          REQUEST: ${steps.loadTicket.result.request}
                          CYCLES: ${variables.reviewCycle}
                          REVIEWER: ${input.reviewerId}
                        failOnError: false
                        timeout: 300000
                        output:
                          captureStdout: true
                          captureStderr: true

                    - id: readPrUrl
                      name: Read pull request url
                      type: cli_command
                      dependsOn: createPullRequest
                      config:
                        command: node
                        args:
                          - -e
                          - |
                            const d = JSON.parse(process.env.PR || '{}');
                            process.stdout.write(String(d.prUrl || ''));
                        env:
                          PR: ${steps.createPullRequest.outputs.stdout}
                        failOnError: false
                        output:
                          captureStdout: true

                    - id: readPrNumber
                      name: Read pull request number
                      type: cli_command
                      dependsOn: readPrUrl
                      config:
                        command: node
                        args:
                          - -e
                          - |
                            const d = JSON.parse(process.env.PR || '{}');
                            process.stdout.write(d.prNumber == null ? '' : String(d.prNumber));
                        env:
                          PR: ${steps.createPullRequest.outputs.stdout}
                        failOnError: false
                        output:
                          captureStdout: true

                    - id: prPublishedGate
                      name: Did the pull request publish
                      type: condition
                      dependsOn: readPrNumber
                      config:
                        condition: steps.readPrUrl.stdout && steps.readPrUrl.stdout.indexOf('/pull/') !== -1
                        thenSteps:
                          - id: prPublishedComment
                            name: Comment pull request on ticket
                            type: service_invoke
                            config:
                              service: core.ReactorySupportWorkflowService@1.0.0
                              method: addComment
                              params:
                                ticketId: ${steps.loadTicket.result.id}
                                comment: Pull request ${steps.readPrUrl.outputs.stdout} opened for branch
                                  ${steps.readBranch.outputs.stdout}. A human approval
                                  task has been raised - the ticket moves to resolved
                                  only once the pull request is merged.

                          # ── Human approval of the pull request ──────────────
                          - id: prApprovalGate
                            name: Pull request approval required
                            type: condition
                            dependsOn: prPublishedComment
                            config:
                              condition: steps.resolveSignoff.stdout === 'true'
                              thenSteps:
                                - id: prApproval
                                  name: Approve and merge pull request
                                  type: user_activity
                                  config:
                                    activityType: approval
                                    assignee: ${steps.loadTicket.result.assignedToEmail}
                                    message: Approve and merge the pull request for
                                      ${steps.loadTicket.result.reference} -
                                      ${steps.readPrUrl.outputs.stdout}
                                    props:
                                      ticketReference: ${steps.loadTicket.result.reference}
                                      ticketId: ${steps.loadTicket.result.id}
                                      prUrl: ${steps.readPrUrl.outputs.stdout}
                                      prNumber: ${steps.readPrNumber.outputs.stdout}
                                      branch: ${steps.readBranch.outputs.stdout}
                                      worktree: ${steps.readWorktreePath.outputs.stdout}
                                      agentId: ${input.agentId}
                                      reviewerId: ${input.reviewerId}
                                      chatSessionId: ${variables.engineerSessionId}
                                      reviewCycles: ${variables.reviewCycle}
                                      reviewVerdict: ${variables.reviewVerdict}
                                    propsMap:
                                      ticketRequest: steps.loadTicket.result.request
                                      ticketStatus: steps.loadTicket.result.status
                                - id: prDecision
                                  name: Apply pull request decision
                                  type: condition
                                  dependsOn: prApproval
                                  config:
                                    condition: steps.prApproval.approved === true
                                    thenSteps:
                                      - id: setPrApproved
                                        name: Record pull request approval
                                        type: set_variable
                                        config:
                                          action: set
                                          key: prApproved
                                          value: "true"
                                      - id: prApprovedComment
                                        name: Comment pull request approval
                                        type: service_invoke
                                        dependsOn: setPrApproved
                                        config:
                                          service: core.ReactorySupportWorkflowService@1.0.0
                                          method: addComment
                                          params:
                                            ticketId: ${steps.loadTicket.result.id}
                                            comment: Pull request APPROVED for merge by
                                              ${steps.prApproval.outputs.completedByEmail}.
                                              Polling GitHub every 3 minutes for the
                                              merge (20 checks maximum).
                                      - id: prApprovedLog
                                        name: Log pull request approval
                                        type: log
                                        dependsOn: prApprovedComment
                                        config:
                                          level: info
                                          message: Pull request APPROVED for ${steps.loadTicket.result.reference} by
                                            ${steps.prApproval.outputs.completedByEmail} - polling for merge.
                                    elseSteps:
                                      - id: prDeclinedComment
                                        name: Comment pull request decline
                                        type: service_invoke
                                        config:
                                          service: core.ReactorySupportWorkflowService@1.0.0
                                          method: addComment
                                          params:
                                            ticketId: ${steps.loadTicket.result.id}
                                            comment: Pull request DECLINED by
                                              ${steps.prApproval.outputs.completedByEmail}.
                                              The ticket stays in_progress; branch
                                              ${steps.readBranch.outputs.stdout} and
                                              ${steps.readPrUrl.outputs.stdout} remain
                                              available for inspection.
                                      - id: prDeclinedLog
                                        name: Log pull request decline
                                        type: log
                                        dependsOn: prDeclinedComment
                                        config:
                                          level: warn
                                          message: Pull request DECLINED for ${steps.loadTicket.result.reference} by
                                            ${steps.prApproval.outputs.completedByEmail} - no merge
                                            poll, ticket left in_progress.
                              elseSteps:
                                - id: logNoSignoff
                                  name: Log PR approval skipped
                                  type: log
                                  config:
                                    level: info
                                    message: Human PR approval skipped for ${steps.loadTicket.result.reference}
                                      (requireSignoff=false) - polling for merge immediately.
                                - id: setPrApprovedNoSignoff
                                  name: Record approval bypass
                                  type: set_variable
                                  dependsOn: logNoSignoff
                                  config:
                                    action: set
                                    key: prApproved
                                    value: "true"

                          # ── Merge polling (3 minutes, 20 attempts) ───────────
                          - id: pollMerge
                            name: Poll pull request merge state
                            type: while
                            dependsOn: prApprovalGate
                            config:
                              condition: variables.prApproved === 'true' && variables.prState !== 'MERGED'
                                && variables.prState !== 'CLOSED' && Number(variables.prPollCount) < 20
                              steps:
                                - id: pollWait
                                  name: Wait between merge polls
                                  type: delay
                                  config:
                                    duration: 180000
                                    message: Waiting 3 minutes before checking whether the pull request
                                      was merged.
                                - id: checkMerge
                                  name: Check merge state
                                  type: cli_command
                                  dependsOn: pollWait
                                  config:
                                    command: gh
                                    args:
                                      - pr
                                      - view
                                      - ${steps.readPrUrl.outputs.stdout}
                                      - "--json"
                                      - state,mergedAt,url,number
                                    failOnError: false
                                    output:
                                      captureStdout: true
                                      captureStderr: true
                                - id: readMergeState
                                  name: Read merge state
                                  type: cli_command
                                  dependsOn: checkMerge
                                  config:
                                    command: node
                                    args:
                                      - -e
                                      - |
                                        // Preserve the previous state when gh fails (network,
                                        // auth). An empty value must not be read as "not merged".
                                        const raw = String(process.env.RAW || '').trim();
                                        const prev = String(process.env.PREV || 'unknown').trim() || 'unknown';
                                        let state = prev;
                                        try {
                                          const d = JSON.parse(raw);
                                          if (d && typeof d.state === 'string' && d.state.trim()) {
                                            state = d.state.trim().toUpperCase();
                                          }
                                        } catch (e) {
                                          state = prev;
                                        }
                                        process.stdout.write(state);
                                    env:
                                      RAW: ${steps.checkMerge.outputs.stdout}
                                      PREV: ${variables.prState}
                                    failOnError: false
                                    output:
                                      captureStdout: true
                                - id: setPrState
                                  name: Record merge state
                                  type: set_variable
                                  dependsOn: readMergeState
                                  config:
                                    action: set
                                    key: prState
                                    source: step_output
                                    sourcePath: readMergeState.outputs.stdout
                                - id: bumpPoll
                                  name: Increment poll count
                                  type: cli_command
                                  dependsOn: setPrState
                                  config:
                                    command: node
                                    args:
                                      - -e
                                      - |
                                        const n = Number(String(process.env.N || '0').trim());
                                        process.stdout.write(String((Number.isFinite(n) ? n : 0) + 1));
                                    env:
                                      N: ${variables.prPollCount}
                                    failOnError: true
                                    output:
                                      captureStdout: true
                                - id: setPollCount
                                  name: Record poll count
                                  type: set_variable
                                  dependsOn: bumpPoll
                                  config:
                                    action: set
                                    key: prPollCount
                                    source: step_output
                                    sourcePath: bumpPoll.outputs.stdout

                          # ── Merge outcome ────────────────────────────────────
                          - id: mergeOutcome
                            name: Merge outcome
                            type: condition
                            dependsOn: pollMerge
                            config:
                              condition: variables.prState === 'MERGED'
                              thenSteps:
                                - id: resolveTicket
                                  name: Move ticket to resolved
                                  type: service_invoke
                                  config:
                                    service: core.ReactorySupportWorkflowService@1.0.0
                                    method: updateStatus
                                    params:
                                      ticketId: ${steps.loadTicket.result.id}
                                      status: resolved
                                      comment: Pull request ${steps.readPrUrl.outputs.stdout} MERGED.
                                        AI engineering run for
                                        ${steps.loadTicket.result.reference} is complete -
                                        ticket moved to resolved.
                                - id: resolvedNotify
                                  name: Notify resolution
                                  type: service_invoke
                                  dependsOn: resolveTicket
                                  config:
                                    service: core.ReactorySupportWorkflowService@1.0.0
                                    method: notify
                                    params:
                                      event: ticket.resolved
                                      ticketId: ${steps.loadTicket.result.id}
                                      extra:
                                        prUrl: ${steps.readPrUrl.outputs.stdout}
                                        branch: ${steps.readBranch.outputs.stdout}
                                        mergePolls: ${variables.prPollCount}
                                - id: resolvedLog
                                  name: Log resolution
                                  type: log
                                  dependsOn: resolvedNotify
                                  config:
                                    level: info
                                    message: Pull request MERGED - ${steps.loadTicket.result.reference}
                                      moved to resolved after
                                      ${variables.prPollCount} merge poll(s).
                              elseSteps:
                                - id: notMergedReason
                                  name: Why the pull request is not merged
                                  type: condition
                                  config:
                                    condition: variables.prApproved === 'true'
                                    thenSteps:
                                      - id: mergeTimeoutComment
                                        name: Comment merge timeout
                                        type: service_invoke
                                        config:
                                          service: core.ReactorySupportWorkflowService@1.0.0
                                          method: addComment
                                          params:
                                            ticketId: ${steps.loadTicket.result.id}
                                            comment: Pull request ${steps.readPrUrl.outputs.stdout} was
                                              not merged after
                                              ${variables.prPollCount} checks
                                              (state ${variables.prState}). The ticket
                                              stays in_progress and a human task has
                                              been raised.
                                      - id: mergeTimeoutTask
                                        name: Human merge follow-up
                                        type: user_activity
                                        dependsOn: mergeTimeoutComment
                                        config:
                                          activityType: approval
                                          assignee: ${steps.loadTicket.result.assignedToEmail}
                                          message: Merge follow-up needed for
                                            ${steps.loadTicket.result.reference} -
                                            ${steps.readPrUrl.outputs.stdout}
                                          props:
                                            ticketReference: ${steps.loadTicket.result.reference}
                                            ticketId: ${steps.loadTicket.result.id}
                                            prUrl: ${steps.readPrUrl.outputs.stdout}
                                            prNumber: ${steps.readPrNumber.outputs.stdout}
                                            branch: ${steps.readBranch.outputs.stdout}
                                            worktree: ${steps.readWorktreePath.outputs.stdout}
                                            prState: ${variables.prState}
                                            mergePolls: ${variables.prPollCount}
                                      - id: mergeTimeoutAck
                                        name: Comment merge follow-up
                                        type: service_invoke
                                        dependsOn: mergeTimeoutTask
                                        config:
                                          service: core.ReactorySupportWorkflowService@1.0.0
                                          method: addComment
                                          params:
                                            ticketId: ${steps.loadTicket.result.id}
                                            comment: Merge follow-up acknowledged by
                                              ${steps.mergeTimeoutTask.outputs.completedByEmail}.
                                              The ticket remains in_progress until the
                                              pull request is merged.
                                      - id: mergeTimeoutLog
                                        name: Log merge timeout
                                        type: log
                                        dependsOn: mergeTimeoutAck
                                        config:
                                          level: warn
                                          message: Pull request for ${steps.loadTicket.result.reference}
                                            not merged after ${variables.prPollCount} checks (state
                                            ${variables.prState}) - human follow-up raised.
                                    elseSteps:
                                      - id: prNotApprovedLog
                                        name: Log pull request not approved
                                        type: log
                                        config:
                                          level: warn
                                          message: Merge polling skipped for ${steps.loadTicket.result.reference}
                                            - the pull request was not approved. Ticket left in_progress.

                        elseSteps:
                          - id: publishFailedComment
                            name: Comment publish failure
                            type: service_invoke
                            config:
                              service: core.ReactorySupportWorkflowService@1.0.0
                              method: addComment
                              params:
                                ticketId: ${steps.loadTicket.result.id}
                                comment: AI engineering run was reviewed and ACCEPTED, but
                                  publishing branch
                                  ${steps.readBranch.outputs.stdout} or opening the
                                  pull request failed - see the workflow run output.
                                  Work remains in the worktree
                                  ${steps.readWorktreePath.outputs.stdout}. Human
                                  attention required.
                          - id: publishFailedTask
                            name: Human publish follow-up
                            type: user_activity
                            dependsOn: publishFailedComment
                            config:
                              activityType: approval
                              assignee: ${steps.loadTicket.result.assignedToEmail}
                              message: Publish failed for ${steps.loadTicket.result.reference}
                                - review branch ${steps.readBranch.outputs.stdout}
                                manually
                              props:
                                ticketReference: ${steps.loadTicket.result.reference}
                                ticketId: ${steps.loadTicket.result.id}
                                branch: ${steps.readBranch.outputs.stdout}
                                worktree: ${steps.readWorktreePath.outputs.stdout}
                                publishError: ${steps.createPullRequest.outputs.stdout}
                          - id: publishFailedLog
                            name: Log publish failure
                            type: log
                            dependsOn: publishFailedTask
                            config:
                              level: warn
                              message: Could not publish branch ${steps.readBranch.outputs.stdout} for
                                ${steps.loadTicket.result.reference} - pull request not
                                created.
                  elseSteps:
                    - id: exhaustedLog
                      name: Log review exhausted
                      type: log
                      config:
                        level: warn
                        message: "AI run NOT accepted for ${steps.loadTicket.result.reference} after
                          ${variables.reviewCycle} review cycle(s) (verdict:
                          ${variables.reviewVerdict})."
                    - id: exhaustedComment
                      name: Comment exhaustion on ticket
                      type: service_invoke
                      dependsOn: exhaustedLog
                      config:
                        service: core.ReactorySupportWorkflowService@1.0.0
                        method: addComment
                        params:
                          ticketId: ${steps.loadTicket.result.id}
                          comment: "AI engineering run did NOT reach an accepted state after
                            ${variables.reviewCycle} review cycle(s) (last
                            verdict: ${variables.reviewVerdict}). Work in
                            progress remains on branch
                            ${steps.readBranch.outputs.stdout}. Human review
                            required - the SLA escalation workflow will also
                            pick this up."
                    - id: exhaustedNotify
                      name: Notify exhaustion
                      type: service_invoke
                      dependsOn: exhaustedComment
                      config:
                        service: core.ReactorySupportWorkflowService@1.0.0
                        method: notify
                        params:
                          event: ticket.comment.added
                          ticketId: ${steps.loadTicket.result.id}
                          extra:
                            reason: AI engineering run exhausted its review cycles without approval.
            elseSteps:
              - id: notCompletedLog
                name: Log non-completion
                type: log
                config:
                  level: warn
                  message: AI run did NOT complete for ${steps.loadTicket.result.reference} -
                    status '${steps.readReportStatus.outputs.stdout}'.
              - id: notCompletedComment
                name: Comment non-completion on ticket
                type: service_invoke
                dependsOn: notCompletedLog
                config:
                  service: core.ReactorySupportWorkflowService@1.0.0
                  method: addComment
                  params:
                    ticketId: ${steps.loadTicket.result.id}
                    comment: "AI engineering run did not complete: the agent reported status
                      '${steps.readReportStatus.outputs.stdout}' with a valid
                      completion report. See the run report in the worktree.
                      Human attention required."
        - id: reportRunOutcome
          name: Report run outcome
          type: log
          dependsOn: reportBranch
          config:
            level: info
            message: Run outcome - ticket=${steps.loadTicket.result.reference}
              verdict=${variables.reviewVerdict} cycles=${variables.reviewCycle}
              branch=${steps.readBranch.outputs.stdout}
              session=${variables.engineerSessionId}
        - id: logAudit
          name: Log audit trail
          type: log
          dependsOn: reportBranch
          config:
            level: info
            message: Audit - ticket=${steps.loadTicket.result.reference}
              agent=${input.agentId} reviewer=${input.reviewerId}
              branch=${steps.readBranch.outputs.stdout}
              cycles=${variables.reviewCycle} verdict=${variables.reviewVerdict}
              session=${variables.engineerSessionId}
      elseSteps:
        - id: logTicketNotFound
          name: Log ticket not found
          type: log
          config:
            level: warn
            message: No support ticket found for ${steps.guardInputs.outputs.stdout} -
              nothing to do.
