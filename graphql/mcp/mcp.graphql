type MCPRegistryCredentials {
  type: String
  token: String
  username: String
}

type MCPRegistry {
  id: String!
  name: String!
  type: String!
  url: String!
  description: String
  credentials: MCPRegistryCredentials
  enabled: Boolean
  createdAt: String
  updatedAt: String
}

type MCPRegistrySearchResult {
  id: String!
  name: String!
  description: String
  version: String
  author: String
  transport: String!
  registryType: String!
  githubUrl: String
  npmPackage: String
  requiredEnvVars: [String]
}

extend type Query {
  """
  List all configured MCP registries
  """
  mcpRegistries: [MCPRegistry]

  """
  Search for MCP connectors across registered registries
  """
  mcpRegistrySearch(query: String!): [MCPRegistrySearchResult]

  """
  List all available connectors in a specific registry (or all if type is omitted)
  """
  mcpRegistryList(type: String): [MCPRegistrySearchResult]
  
  """
  Get detailed information about a specific connector from a registry
  """
  mcpRegistryConnectorDetails(connectorId: String!, type: String!): Any
}