"""
Physical measurements used to define a persona's appearance.
"""
type ReactorPersonaMetrics {
  height: Float
  weight: Float
  age: Float
}

"""
Defines skin characteristics for a persona's appearance.
"""
type ReactorPersonaSkin {
  color: String
  tone: String
}

"""
Controls for image adjustments and filters for persona backgrounds.
"""
type ReactorPersonaBackgroundImage {
  alpha: Float
  brightness: Float
  contrast: Float
  blur: Float
  grayscale: Float
  hueRotate: Float
  invert: Float
  opacity: Float
  saturate: Float
  sepia: Float
  chromaKey: String
}

"""
Controls for timing options when using video backgrounds.
"""
type ReactorPersonaBackgroundTimerOptions {
  loop: Boolean
  loopStart: Float
  loopEnd: Float
}

"""
Audio settings for persona backgrounds that include sound.
"""
type ReactorPersonaBackgrondAudioOptions {
  volume: Float
  mute: Boolean
  autoplay: Boolean
}

"""
Combined settings for managing all aspects of a persona's background.
"""
type ReactorPersonaBackgroundOptions {
  image: ReactorPersonaBackgroundImage
  time: ReactorPersonaBackgroundTimerOptions
  audio: ReactorPersonaBackgrondAudioOptions
  controls: Boolean
}

"""
Defines a background element for a persona, including its source and display options.
"""
type ReactorPersonaBackground {
  src: String
  type: String
  order: Int
  options: ReactorPersonaBackgroundOptions
}

"""
Defines the complete visual and auditory representation of a persona.
"""
type ReactorPersonaAppearance {
  voice: [String]
  face: [String]
  hair: [String]
  body: [String]
  clothes: [String]
  accessories: [String]
  metrics: [ReactorPersonaMetrics]
  skin: [ReactorPersonaSkin]
  background: [ReactorPersonaBackground]
}

"""
A pre-defined message template that can be used to orchestrate 
conversations with other agents or to provide context for the conversation.
"""
type ReactorPersonaPrompt {
  id: String
  """
  The prompt id to use for this prompt.
  """
  content: String
  """
  variables that is required for this prompt.
  """
  variables: [String]
  """
  The role of the prompt. 
  This could be a system prompt, user prompt or assistant prompt.
  """
  role: String
  """
  The persona id to use for this prompt.
  """
  personaId: String 
}

enum ReactorMacroRunAt {
  client
  server
}

"""
A pre-defined set of actions that can be executed at specific points
in a conversation to trigger behaviors or process data.
"""
type ReactorMacro {
  id: String
  nameSpace: String
  name: String
  version: String
  description: String
  alias: String
  icon: String
  params: Any
  roles: [String]
  runat: ReactorMacroRunAt!  
}

"""
Defines a function that can be called by AI models during conversation
to execute specific capabilities.
"""
type ReactorFunction {
  name: String!
  description: String
  icon: String
  inputFormId: String
  parameters: Any
}

"""
Represents a tool that extends the capabilities of the AI persona,
allowing it to perform actions beyond conversation.
"""
type ReactorToolDefinition {
  id: String
  """
  The type will always be "function" for now
  """
  type: String!
  propsMap: Any
  function: ReactorFunction
  roles: [String]
  runat: String  
}

type ReactorPersonaResource {
  id: String
  name: String
  description: String
  type: String
  url: String
}

"""
Represents an AI personality with specific characteristics, capabilities,
and behavior patterns that can engage in conversations.
"""
type ReactorPersona {
  """
  unique id for the persona
  """
  id: String
  """
  The name of the persona. This is a easy to read name that will be used in the UI
  """
  name: String

  """
  The avatar is the url for the persona's avatar image.
  """
  avatar: String
  """
  The model id that will be used for the persona.
  models are gpt4, gpt3.5, etc.
  """
  modelId: String
  """
  The model provider is the organization that provides / process the requests
  eg. openai, google, xai, etc.
  """
  provider: String
  """
  A description of the persona. This is a easy to read description that will be used in the UI
  """
  description: String
  """
  The defaultGreeting used for the persona.
  """
  defaultGreeting: String
  """
  Appearance is the visual representation of the persona.
  This is for future use to create a realtime avatar of the persona.
  """
  appearance: ReactorPersonaAppearance
  """
  A set of pre defined prompts that can be used by the persona
  """
  prompts: [ReactorPersonaPrompt]
  """
  macros is a set of pre defined actions that can be used by the persona
  macros will either run on client side or on the server side.
  """
  macros: [ReactorMacro]
  """
  A set of tools that can be used by the persona. These tools are for use with 
  mcp client and server utilities.
  """
  tools: [ReactorToolDefinition]

  """
  A set of resources that can be used by the persona.
  """
  resources: [ReactorPersonaResource]

  """
  The date the persona was created.
  """
  createdAt: Date
  """
  The date the persona was last updated.
  """
  updatedAt: Date

  """
  The maximum number of tokens allowed for the persona.
  """
  maxTokens: Int
}

input ReactorMacroInput {
  id: String
  name: String!
  nameSpace: String
  version: String
  description: String
  alias: String
  roles: [String]
  params: [String]
  icon: String
}

input ReactorFunctionInput { 
  name: String!
  icon: String
  description: String
  parameters: Any
  roles: [String]
}

input ReactorToolDefinitionInput {
  id: String
  type: String!
  propsMap: Any
  roles: [String]
  function: ReactorFunctionInput
}

input ReactorInitSession { 
  personaId: String!
  message: String
  macros: [ReactorMacroInput]
  tools: [ReactorToolDefinitionInput]
  toolApprovalMode: ReactorToolApprovalMode
}
