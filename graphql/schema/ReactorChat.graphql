"""
Represents a single message in a chat conversation between a user and a persona.
Contains the content and metadata about the message.
"""
type ReactorChatMessage {
  """
  The session ID of the chat session that the message belongs to.
  """
  sessionId: String!
  """
  The token pressure for the session.
  """
  tokenPressure: Float
  """
  The total token count for the message, including both input and output tokens.
  This is used to track the overall token usage for the conversation.
  """
  tokenCount: Int
  """
  The ID of the message.
  """
  id: String
  """
  The role of the message. This will be either "user", "assistant", "tool", or "system".
  """
  role: String
  """
  The content of the message.
  """
  content: String
  """
  The component of the message. This will be a Reactory.FQN type that follows the 
  nameSpace.name@version format.
  """
  component: String
  """
  The props of the message. This will be a JSON object that contains the props of the component.
  """
  props: Any
  """
  The props map of the message. This is a ObjectMap that used with ObjectMapper.merge() to convert 
  the props to the component.
  """
  propsMap: Any
  """
  The audio of the message. This will be a base64 encoded string of the audio.
  or a URL to the audio file.
  """
  audio: Any
  """
  The annotations of the message. This will be a JSON object that contains the annotations of the component.  
  """
  annotations: Any
  """
  The images of the message. This will be a JSON object that contains the images of the component.
  """
  images: Any
  """
  The rating of the message. This will be a string that contains the rating of the message.
  """
  rating: String
  """
  The timestamp of the message. This will be a date that contains the timestamp of the message.
  """
  timestamp: Date
  """
  The tool calls of the message. This will be a JSON object that contains the tool calls of the component.
  """
  tool_calls: Any
  """
  The tool results of the message. This will be a JSON object that contains the tool results of the component.
  """
  tool_results: Any
  """
  The refusal of the message. This will be a string that contains the refusal of the component.
  """
  refusal: String
}

"""
Contains information for the client to establish a Server-Sent Events (SSE) connection
for real-time streaming of responses.
"""
type ReactorInitiateSSE {
  sessionId: String!
  endpoint: String!
  token: String
  status: String
  expiry: Date
  headers: Any
  chatState: ReactorChatState
}

enum ReactorErrorCategory {
  VALIDATION
  PERMISSION
  RESOURCE_NOT_FOUND
  EXTERNAL_SERVICE
  INTERNAL
  RATE_LIMIT
  TIMEOUT
}

"""
Represents an error that occurred during chat processing.
Contains details about the nature of the error for client handling.
"""
type ReactorErrorResponse {
  code: String!
  message: String!
  details: Any
  timestamp: Date
  recoverable: Boolean
  suggestion: String
  correlationId: String
  operation: String
  userId: String
  conversationId: String
  retryAfter: Int
  errorCategory: ReactorErrorCategory
}

"""
Union type that allows responses to be either a direct message,
instructions to establish an SSE connection for streaming responses,
or error information.
"""
union ReactorChatResponse = ReactorChatMessage | ReactorInitiateSSE | ReactorErrorResponse

enum ReactorToolApprovalMode {
  auto
  prompt
  safe_auto
}

type ReactorSessionVar {
  key: String!
  value: Any
}

enum ReactorChatContextResourceType {
  """
  Represents a file resource in the chat context.
  """
  file
  """
  Represents a folder resource in the chat context.
  """
  folder
  """
  Represents a URL resource in the chat context.
  """
  url
}

"""
Represents a resource that can be used in the chat context.
Includes file, folder, or URL resources with associated metadata.
"""
type ReactorChatContextResource {
  type: ReactorChatContextResourceType!
  name: String!
  description: String
  url: String!
  """
  The tool advice for the resource.
  This is a string that provides guidance on how the resource can be used with tools.
  """
  toolAdvice: String
}

"""
Represents the overall state of a chat conversation, including
its history and metadata.
"""
type ReactorChatState {
  id: String
  personaId: String
  created: Date
  updated: Date
  user: User
  history: [ReactorChatMessage]
  truncatedHistory: [ReactorChatMessage]
  """
  The maximum number of tokens allowed for the conversation.
  """
  maxTokens: Int
  """
  The current token count for the conversation.
  """
  tokenCount: Int
  """
  The pressure of the token count. This is the ratio of the token count to the max tokens.
  """
  tokenPressure: Float
  """
  The tools used in the conversation.
  """
  tools: [ReactorToolDefinition]
  """
  The macros used in the conversation.
  """
  macros: [ReactorMacro]
  """
  The session variables for the chat session.
  These are key-value pairs that can be used to store state or configuration for the session.
  """
  vars: Any
  """
  Indicates whether the chat session has an active MCP client.
  This is true if the session has an MCP client that can be used to execute tools.
  """
  hasMcpClient: Boolean
  """
  The MCP sessions associated with the chat session.
  This includes details about the MCP server, session ID, and available tools.
  """
  mcpSessions: [ReactorMCPSession]
  """
  The current tool approval mode for the chat session.
  This determines how tools are approved for use by the persona.
  """
  toolApprovalMode: ReactorToolApprovalMode
  """
  Files that have been attached to the chat session.
  This includes both regular files and audio files.
  """
  files: [ReactoryFile]
  """
  Folders that have been attached to the chat session.
  This includes both regular folders and folders containing files.
  """
  folders: [ReactoryFolder]

  """
  Represents a resource that can be used in the chat context.
  """
  resources: [ReactorChatContextResource]  
}

"""
Represents a Model Context Protocol (MCP) session and its configuration details.
"""
type ReactorMCPSession {
  id: String!
  serverName: String!
  description: String
  sessionId: String
  serviceCommand: String
  url: String!
  headers: Any
  status: String # started, stopped, error
  tools: [ReactorToolDefinition]
}

"""
Criteria for filtering conversation lists by various parameters.
"""
input ReactorConversationFilter {
  personaId: String
  userId: String
  modelId: String
}

"""
Input parameters for sending a message to a persona.
"""
input ReactorSendMessageInput {
  personaId: String!
  chatSessionId: String
  message: String!
  streamingMode: StreamingMode
}

"""
Enum representing different streaming modes for real-time message delivery.
"""
enum StreamingMode {
  """
  No streaming - traditional request/response mode
  """
  NONE
  """
  Server-Sent Events streaming for real-time token delivery
  """
  SSE
  """
  WebSocket streaming for bidirectional real-time communication
  """
  WEBSOCKET
}

"""
Input parameters for executing a macro within a chat session on the server side.
"""
input ReactorMacroExecuteInput {
  macro: String!
  personaId: String!
  chatSessionId: String!
  calledBy: String
  callId: String
  args: Any
}

"""
Input parameters for executing a tool within a chat session.
"""
input ReactorToolExecuteInput {
  tool: String!
  personaId: String!
  chatSessionId: String!
  calledBy: String
  callId: String
  args: Any
}

"""
Response type for file attachment operations.
"""
union ReactorAttachFileResponse = ReactorChatResponse | ReactorErrorResponse

"""
Response type for file detachment operations.
Input type for attaching a user file to a chat session
"""
input ReactorAttachUserFileParam {
  sessionId: String!
  fileId: String!
  """
  Optional description for the file being attached.
  This can be used to provide context or details about the file to the llm
  """
  description: String
  path: String!
}

"""
Input type for detaching a user file from a chat session
"""
input ReactorDetachUserFileParam {
  sessionId: String!
  fileId: String!
  delete: Boolean
  path: String!
}

"""
Response type for successful file attachment
"""
type ReactorAttachFileResponse {
  success: Boolean!
  message: String!
  sessionId: String!
  fileId: String!
  path: String!
}

"""
Response type for successful file detachment
"""
type ReactorDetachFileResponse {
  success: Boolean!
  message: String!
  sessionId: String!
  fileId: String!
  path: String!
}

"""
Union types for file operations
"""
union ReactorAttachFileResult = ReactorAttachFileResponse | ReactorErrorResponse
union ReactorDetachFileResult = ReactorDetachFileResponse | ReactorErrorResponse

input ReactorConversationLoadOptions {
  showAllFiles: Boolean
}

union ReactorChatStateOrError = ReactorChatState | ReactorErrorResponse
union ReactorInitChatResponse = ReactorChatState | ReactorErrorResponse | ReactorInitiateSSE

extend type Query {

  """
  Retrieves all chat conversations for the currently authenticated user,
  with optional filtering.
  """
  ReactorConversations(filter: ReactorConversationFilter): [ReactorChatState]

  """
  Retrieves a specific chat conversation by its ID.
  """
  ReactorConversation(id: String!, loadOptions: ReactorConversationLoadOptions): ReactorChatStateOrError

  """
  Lists all available AI personas that the current user can access.
  """
  ReactorPersonas: [ReactorPersona]
}



extend type Mutation {
  """
  Creates a new chat session with a specified persona and provides
  the initial message to start the conversation using the persona's default greeting.
  """
  ReactorStartChatSession(initSession: ReactorInitSession!): ReactorInitChatResponse

  """
  Set the tool approval mode for a chat session.
  This determines how tools are approved for use by the persona.
  """
  ReactorSetChatToolApprovalMode(
    chatSessionId: String!
    mode: ReactorToolApprovalMode!
  ): ReactorChatState

  """
  Sends a message to a persona and returns either a direct response
  or SSE connection details for streaming responses.
  Supports optional streaming mode parameter for real-time delivery.
  """
  ReactorSendMessage(message: ReactorSendMessageInput!): ReactorChatResponse

  """
  Executes a predefined macro within the context of a chat session.
  """
  ReactorExecuteMacro(macroInput: ReactorMacroExecuteInput!): ReactorChatResponse

  """
  Activates a specific tool for use by the persona in the current chat session.
  """
  ReactorExecuteTool(toolInput: ReactorToolDefinitionInput!): ReactorChatResponse
  
  """
  Adds an image to the current chat conversation for analysis by the persona.
  """
  ReactorAttachFile(file: Upload!, chatSessionId: String!): ReactorChatResponse

  """
  Attaches an existing user file to a chat session.
  """
  ReactorAttachUserFileToSession(params: ReactorAttachUserFileParam!): ReactorAttachFileResult

  """
  Detaches a user file from a chat session.
  """
  ReactorDetachUserFileFromSession(params: ReactorDetachUserFileParam!): ReactorDetachFileResult

  """
  Permanently removes a chat session and all its messages.
  """
  ReactorDeleteChatSession(id: String!): Boolean

  """
  Converts spoken audio to text and sends it as a message to the persona.
  """
  ReactorAskQuestionAudio(audio: Upload!, chatSessionId: String!): ReactorChatResponse
}

