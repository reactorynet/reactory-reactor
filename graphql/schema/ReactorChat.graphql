"""
Status of a single todo item within a todo list.
"""
enum ReactorTodoStatus {
  pending
  in_progress
  completed
  failed
  cancelled
}

"""
Execution strategy for todo items in a list.
"""
enum ReactorTodoExecutionMode {
  series
  parallel
}

"""
A single todo item within a todo list managed by the AI agent.
"""
type ReactorTodoItem {
  id: String!
  title: String!
  description: String
  status: ReactorTodoStatus!
  assignee: String
  result: Any
  error: String
  createdAt: String!
  updatedAt: String!
}

"""
A todo list created and managed by AI agents via the todo macro.
Todo lists are stored in the conversation vars under the key "reactor.todos".
"""
type ReactorTodoList {
  id: String!
  name: String!
  executionMode: ReactorTodoExecutionMode!
  items: [ReactorTodoItem!]!
  createdAt: String!
  updatedAt: String!
}

"""
Represents the status of a tool call execution lifecycle.
"""
enum ReactorToolCallStatus {
  """Tool call has been requested by the AI but not yet started"""
  pending
  """Tool call is currently executing"""
  running
  """Tool call completed successfully"""
  success
  """Tool call failed with an error"""
  error
}

"""
Represents the function invocation details within a tool call.
"""
type ReactorToolCallFunction {
  """The name of the function/tool being called"""
  name: String!
  """The arguments passed to the function, serialized as JSON string"""
  arguments: String
}

"""
Represents a single tool call requested by the AI assistant.
Contains the call metadata and its current execution status.
"""
type ReactorToolCall {
  """The unique identifier for this tool call (e.g. 'call_abc123')"""
  id: String!
  """The type of tool call, typically 'function'"""
  type: String
  """The function invocation details"""
  function: ReactorToolCallFunction
  """
  The current execution status of this tool call.
  Derived from whether a matching tool result or error exists in the conversation history.
  """
  status: ReactorToolCallStatus!
}

"""
Represents the result of a successfully executed tool call.
"""
type ReactorToolResult {
  """The tool call ID this result corresponds to"""
  id: String!
  """The name of the tool/macro that was executed"""
  name: String
  """The result content returned by the tool execution"""
  content: Any
  """The timestamp when the tool result was recorded"""
  timestamp: Date
}

"""
Represents an error that occurred during tool call execution.
"""
type ReactorToolError {
  """The tool call ID this error corresponds to"""
  id: String!
  """The name of the tool/macro that failed"""
  name: String
  """The error message describing what went wrong"""
  error: String
  """The timestamp when the error occurred"""
  timestamp: Date
}

"""
Represents a single message in a chat conversation between a user and a persona.
Contains the content and metadata about the message.
"""
type ReactorChatMessage {
  """
  The session ID of the chat session that the message belongs to.
  """
  sessionId: String!
  """
  The token pressure for the session.
  """
  tokenPressure: Float
  """
  The total token count for the message, including both input and output tokens.
  This is used to track the overall token usage for the conversation.
  """
  tokenCount: Int
  """
  The ID of the message.
  """
  id: String
  """
  The role of the message. This will be either "user", "assistant", "tool", or "system".
  """
  role: String
  """
  The content of the message.
  """
  content: Any
  """
  The component of the message. This will be a Reactory.FQN type that follows the 
  nameSpace.name@version format.
  """
  component: String
  """
  The props of the message. This will be a JSON object that contains the props of the component.
  """
  props: Any
  """
  The props map of the message. This is a ObjectMap that used with ObjectMapper.merge() to convert 
  the props to the component.
  """
  propsMap: Any
  """
  The audio of the message. This will be a base64 encoded string of the audio.
  or a URL to the audio file.
  """
  audio: Any
  """
  The annotations of the message. This will be a JSON object that contains the annotations of the component.  
  """
  annotations: Any
  """
  The images of the message. This will be a JSON object that contains the images of the component.
  """
  images: Any
  """
  The rating of the message. This will be a string that contains the rating of the message.
  """
  rating: String
  """
  The timestamp of the message. This will be a date that contains the timestamp of the message.
  """
  timestamp: Date
  """
  The tool calls requested by the AI in this message.
  Each tool call includes its execution status, derived from
  whether matching tool results or errors exist in the conversation history.
  """
  tool_calls: [ReactorToolCall]
  """
  The results from executed tool calls associated with this message.
  For assistant messages, these are correlated from subsequent tool-role messages in the history.
  """
  tool_results: [ReactorToolResult]
  """
  The errors from failed tool calls associated with this message.
  For assistant messages, these are correlated from subsequent tool-role messages in the history.
  """
  tool_errors: [ReactorToolError]
  """
  The refusal of the message. This will be a string that contains the refusal of the component.
  """
  refusal: String
  """
  The reasoning/thinking content from AI models that support extended thinking
  (e.g. OpenAI o1/o3, Anthropic Claude extended thinking, Google Gemini thinking mode).
  Contains the model's internal chain-of-thought before producing the final response.
  """
  thinking: String
}

"""
Contains information for the client to establish a Server-Sent Events (SSE) connection
for real-time streaming of responses.
"""
type ReactorInitiateSSE {
  sessionId: String!
  endpoint: String!
  token: String
  status: String
  expiry: Date
  headers: Any
  chatState: ReactorChatState
}

enum ReactorErrorCategory {
  VALIDATION
  PERMISSION
  RESOURCE_NOT_FOUND
  EXTERNAL_SERVICE
  INTERNAL
  RATE_LIMIT
  TIMEOUT
}

"""
Represents an error that occurred during chat processing.
Contains details about the nature of the error for client handling.
"""
type ReactorCompactionResult {
  success: Boolean!
  messagesArchived: Int!
  tokensBefore: Int!
  tokensAfter: Int!
  usedFallback: Boolean!
  error: String
}

type ReactorErrorResponse {
  code: String!
  message: String!
  details: Any
  timestamp: Date
  recoverable: Boolean
  suggestion: String
  correlationId: String
  operation: String
  userId: String
  conversationId: String
  retryAfter: Int
  errorCategory: ReactorErrorCategory
}

"""
Union type that allows responses to be either a direct message,
instructions to establish an SSE connection for streaming responses,
or error information.
"""
union ReactorChatResponse = ReactorChatMessage | ReactorInitiateSSE | ReactorErrorResponse

enum ReactorToolApprovalMode {
  auto
  safe_auto
  prompt
  plan
}

"""
Represents the user's decision when prompted to approve a tool call.
"""
enum ReactorToolApprovalDecision {
  """Tool was approved and executed normally"""
  approved
  """User deliberately chose not to run this tool (not a failure)"""
  declined
  """User provided alternative guidance instead of running the tool"""
  instructed
}

type ReactorSessionVar {
  key: String!
  value: Any
}

enum ReactorChatContextResourceType {
  """
  Represents a file resource in the chat context.
  """
  file
  """
  Represents a folder resource in the chat context.
  """
  folder
  """
  Represents a URL resource in the chat context.
  """
  url
}

"""
Represents a resource that can be used in the chat context.
Includes file, folder, or URL resources with associated metadata.
"""
type ReactorChatContextResource {
  type: ReactorChatContextResourceType!
  name: String!
  description: String
  url: String!
  """
  The tool advice for the resource.
  This is a string that provides guidance on how the resource can be used with tools.
  """
  toolAdvice: String
}

"""
Represents the overall state of a chat conversation, including
its history and metadata.
"""
type ReactorChatState {
  id: String
  personaId: String
  """
  A short title for the conversation, auto-generated from the user's first message.
  """
  title: String
  created: Date
  updated: Date
  user: User
  history: [ReactorChatMessage]
  truncatedHistory: [ReactorChatMessage]
  """
  The maximum number of tokens allowed for the conversation.
  """
  maxTokens: Int
  """
  The current token count for the conversation.
  """
  tokenCount: Int
  """
  The pressure of the token count. This is the ratio of the token count to the max tokens.
  """
  tokenPressure: Float
  """
  The tools used in the conversation.
  """
  tools: [ReactorToolDefinition]
  """
  The macros used in the conversation.
  """
  macros: [ReactorMacro]
  """
  The session variables for the chat session.
  These are key-value pairs that can be used to store state or configuration for the session.
  """
  vars: Any
  """
  Indicates whether the chat session has an active MCP client.
  This is true if the session has an MCP client that can be used to execute tools.
  """
  hasMcpClient: Boolean
  """
  The MCP sessions associated with the chat session.
  This includes details about the MCP server, session ID, and available tools.
  """
  mcpSessions: [ReactorMCPSession]
  """
  The current tool approval mode for the chat session.
  This determines how tools are approved for use by the persona.
  """
  toolApprovalMode: ReactorToolApprovalMode
  """
  The maximum number of auto tool call iterations before pausing for user confirmation.
  When null, the server default is used.
  """
  maxToolIterations: Int
  """
  Files that have been attached to the chat session.
  This includes both regular files and audio files.
  """
  files: [ReactoryFile]
  """
  Folders that have been attached to the chat session.
  This includes both regular folders and folders containing files.
  """
  folders: [ReactoryFolder]

  """
  Represents a resource that can be used in the chat context.
  """
  resources: [ReactorChatContextResource]

  """
  Optional reference to the parent session that provided context for this session.
  Enables tracking conversation lineage across different agents.
  """
  parentSessionId: String
  """
  Child conversations spawned from this session (sub-agent delegations).
  Populated via the parentSessionId relationship.
  """
  chats: [ReactorChatState]
  """
  The currently active model ID for this session. When set, overrides the persona default.
  """
  modelId: String
  """
  The currently active provider ID for this session. When set, overrides the persona default.
  """
  providerId: String
  """
  The persisted side panel state for the conversation.
  """
  sidePanelState: ReactorSidePanelState
  """
  Whether image generation mode (creative mode) is enabled for this session.
  When enabled and the active model supports it, responses may include generated images.
  """
  imageGenerationEnabled: Boolean
}

"""
Represents a Model Context Protocol (MCP) session and its configuration details.
"""
type ReactorMCPSession {
  id: String!
  serverName: String!
  description: String
  sessionId: String
  serviceCommand: String
  url: String!
  headers: Any
  status: String # started, stopped, error
  tools: [ReactorToolDefinition]
}

"""
Criteria for filtering conversation lists by various parameters.
"""
input ReactorConversationFilter {
  personaId: String
  userId: String
  modelId: String
}

"""
Input parameters for sending a message to a persona.
"""
input ReactorSendMessageInput {
  personaId: String!
  chatSessionId: String
  message: String!
  streamingMode: StreamingMode
  """
  Optional message role. Defaults to "user". Use "tool" when sending tool execution results back.
  """
  role: String
  """
  When role is "tool", the tool_call_id that this result responds to.
  """
  tool_call_id: String
  """
  Optional model ID override. When provided, uses this model instead of the persona default.
  """
  modelId: String
  """
  Optional provider ID override. When provided, uses this provider instead of the persona default.
  """
  providerId: String
  """
  When true, skip persisting the message to history and only call the AI provider.
  Use this when tool results have already been persisted (e.g. by executeMacro)
  and you just need the AI to continue processing.
  """
  continueAfterTools: Boolean
  """
  Optional base64 image data URLs for vision-capable models (e.g. "data:image/png;base64,...").
  Only used when the active model supports image input.
  """
  images: [String]
}

"""
Enum representing different streaming modes for real-time message delivery.
"""
enum StreamingMode {
  """
  No streaming - traditional request/response mode
  """
  NONE
  """
  Server-Sent Events streaming for real-time token delivery
  """
  SSE
  """
  WebSocket streaming for bidirectional real-time communication
  """
  WEBSOCKET
}

"""
Input parameters for executing a macro within a chat session on the server side.
"""
input ReactorMacroExecuteInput {
  macro: String!
  personaId: String!
  chatSessionId: String!
  calledBy: String
  callId: String
  args: Any
}

"""
Input parameters for executing a tool within a chat session.
"""
input ReactorToolExecuteInput {
  tool: String!
  personaId: String!
  chatSessionId: String!
  calledBy: String
  callId: String
  args: Any
}

"""
A single client-side tool execution result reported back to the server.
"""
input ReactorClientToolResultInput {
  """The tool_call ID from the AI that this result responds to"""
  toolCallId: String!
  """The name of the tool/macro that was executed"""
  toolName: String!
  """The result data returned by the client-side tool execution"""
  result: Any
  """Whether the tool execution failed"""
  isError: Boolean
  """Error message when isError is true"""
  error: String
  """The user's approval decision. When 'declined' or 'instructed', the AI receives a user-choice message instead of an error."""
  decision: ReactorToolApprovalDecision
  """User-provided guidance when decision is 'instructed'. Sent to the AI as alternative instruction."""
  userInstruction: String
}

"""
Response type for file attachment operations.
"""
union ReactorAttachFileResponse = ReactorChatResponse | ReactorErrorResponse

"""
Response type for file detachment operations.
Input type for attaching a user file to a chat session
"""
input ReactorAttachUserFileParam {
  sessionId: String!
  fileId: String!
  """
  Optional description for the file being attached.
  This can be used to provide context or details about the file to the llm
  """
  description: String
  path: String!
  """
  When true, register a pointer to an existing path (e.g. desktop absolute path) without copying into managed storage.
  """
  referenceOnly: Boolean
}

"""
Input type for detaching a user file from a chat session
"""
input ReactorDetachUserFileParam {
  sessionId: String!
  fileId: String!
  delete: Boolean
  path: String!
}

"""
Response type for successful file attachment
"""
type ReactorAttachFileResponse {
  success: Boolean!
  message: String!
  sessionId: String!
  fileId: String!
  path: String!
}

"""
Response type for successful file detachment
"""
type ReactorDetachFileResponse {
  success: Boolean!
  message: String!
  sessionId: String!
  fileId: String!
  path: String!
}

"""
Union types for file operations
"""
union ReactorAttachFileResult = ReactorAttachFileResponse | ReactorErrorResponse
union ReactorDetachFileResult = ReactorDetachFileResponse | ReactorErrorResponse

input ReactorPinFolderParam {
  sessionId: String!
  path: String!
  name: String!
}

type ReactorPinFolderResponse {
  success: Boolean!
  message: String!
  sessionId: String!
  path: String!
}

union ReactorPinFolderResult = ReactorPinFolderResponse | ReactorErrorResponse
union ReactorUnpinFolderResult = ReactorPinFolderResponse | ReactorErrorResponse

"""
A single persisted side panel item.
"""
type ReactorSidePanelItem {
  id: String!
  componentFqn: String!
  title: String!
  type: String!
  """Serializable component props (reactory SDK excluded — re-injected on restore)."""
  props: Any
  addedAt: Date
  addedBy: String
}

"""
Persisted side panel state for a conversation.
"""
type ReactorSidePanelState {
  items: [ReactorSidePanelItem!]!
  activeItemId: String
  isOpen: Boolean!
}

"""
Input for a single side panel item.
"""
input ReactorSidePanelItemInput {
  id: String!
  componentFqn: String!
  title: String!
  type: String!
  """Serializable component props to persist."""
  props: Any
  addedAt: Date
  addedBy: String
}

"""
Input for persisting side panel state.
"""
input ReactorSidePanelStateInput {
  items: [ReactorSidePanelItemInput!]!
  activeItemId: String
  isOpen: Boolean!
}

input ReactorConversationLoadOptions {
  showAllFiles: Boolean
}

union ReactorChatStateOrError = ReactorChatState | ReactorErrorResponse
union ReactorInitChatResponse = ReactorChatState | ReactorErrorResponse | ReactorInitiateSSE

"""
Represents a voice-enabled chat session with TTS/STT configuration.
"""
type ReactorVoiceSession {
  """The ID of the underlying chat session"""
  chatSessionId: String!
  """The persona ID for this voice session"""
  personaId: String!
  """Whether TTS is enabled for AI responses"""
  ttsEnabled: Boolean!
  """Whether STT is enabled for user input"""
  sttEnabled: Boolean!
  """The voice ID to use for TTS synthesis"""
  voice: String
  """The language for STT transcription"""
  sttLanguage: String
  """WebSocket URL for real-time TTS streaming"""
  ttsStreamUrl: String
  """WebSocket URL for real-time STT streaming"""
  sttStreamUrl: String
  """When the voice session was created"""
  created: Date
}

"""
Input for starting a voice-enabled chat session.
"""
input ReactorStartVoiceSessionInput {
  """The persona to chat with"""
  personaId: String!
  """Optional initial message to start the conversation"""
  message: String
  """Whether to enable TTS for AI responses (default: true)"""
  ttsEnabled: Boolean
  """Whether to enable STT for user input (default: true)"""
  sttEnabled: Boolean
  """The voice ID to use for TTS synthesis"""
  voice: String
  """The language for STT transcription"""
  sttLanguage: String
  """Optional existing chat session ID to enable voice on"""
  chatSessionId: String
}

"""
Input for sending an audio message in a voice session.
"""
input ReactorVoiceMessageInput {
  """The chat session ID"""
  chatSessionId: String!
  """The persona ID"""
  personaId: String!
  """Whether to synthesize the AI response as audio"""
  synthesizeResponse: Boolean
  """The voice to use for TTS synthesis of the response"""
  voice: String
}

"""
A chat response that includes optional audio data.
"""
type ReactorVoiceChatMessage {
  """The text content of the AI response"""
  sessionId: String!
  """The text content of the AI response"""
  content: String
  """The role of the message"""
  role: String
  """Base64-encoded audio of the AI response (if TTS was requested)"""
  audioBase64: String
  """The audio format (e.g., wav, mp3)"""
  audioFormat: String
  """The duration of the audio in seconds"""
  audioDuration: Float
  """Timestamp of the message"""
  timestamp: Date
}

union ReactorVoiceSessionResult = ReactorVoiceSession | ReactorErrorResponse
union ReactorVoiceChatResult = ReactorVoiceChatMessage | ReactorErrorResponse

extend type Query {

  """
  Retrieves all chat conversations for the currently authenticated user,
  with optional filtering.
  """
  ReactorConversations(filter: ReactorConversationFilter): [ReactorChatState]

  """
  Retrieves a specific chat conversation by its ID.
  """
  ReactorConversation(id: String!, loadOptions: ReactorConversationLoadOptions): ReactorChatStateOrError

  """
  Lists all available AI personas that the current user can access.
  """
  ReactorPersonas: [ReactorPersona]
}



extend type Mutation {
  """
  Rate a specific message in a chat session.
  """
  ReactorRateMessage(
    chatSessionId: String!
    messageId: String!
    rating: String!
  ): ReactorChatState

  """
  Creates a new chat session with a specified persona and provides
  the initial message to start the conversation using the persona's default greeting.
  """
  ReactorStartChatSession(initSession: ReactorInitSession!): ReactorInitChatResponse


  """
  Patch the system prompt for a specific chat session.
  """
  ReactorSystemPromptPatch(
    chatSessionId: String!
    systemPrompt: String!
  ): ReactorChatState

  """
  Set the tool approval mode for a chat session.
  This determines how tools are approved for use by the persona.
  """
  ReactorSetChatToolApprovalMode(
    chatSessionId: String!
    mode: ReactorToolApprovalMode!
  ): ReactorChatState

  """
  Set the maximum number of auto tool call iterations for a chat session.
  When set, the agent will pause after this many iterations and ask the user to continue.
  """
  ReactorSetChatMaxToolIterations(
    chatSessionId: String!
    maxToolIterations: Int!
  ): ReactorChatState

  """
  Persist the current side panel state for a chat session.
  Only serializable item metadata is stored (props are excluded).
  """
  ReactorSetSidePanelState(
    chatSessionId: String!
    sidePanelState: ReactorSidePanelStateInput!
  ): ReactorChatState

  """
  Continue tool execution after the agent paused due to reaching the max tool iteration limit.
  Optionally accepts a new max iterations value to apply before resuming.
  """
  ReactorContinueToolExecution(
    chatSessionId: String!
    personaId: String!
    maxToolIterations: Int
    streamingMode: StreamingMode
  ): ReactorChatResponse

  """
  Set the model and/or provider for an existing chat session.
  Persists the selection so it is used for subsequent messages and tool executions.
  """
  ReactorSetChatModelProvider(
    chatSessionId: String!
    modelId: String
    providerId: String
  ): ReactorChatStateOrError

  """
  Sends a message to a persona and returns either a direct response
  or SSE connection details for streaming responses.
  Supports optional streaming mode parameter for real-time delivery.
  """
  ReactorSendMessage(message: ReactorSendMessageInput!): ReactorChatResponse

  """
  Executes a predefined macro within the context of a chat session.
  """
  ReactorExecuteMacro(macroInput: ReactorMacroExecuteInput!): ReactorChatResponse

  """
  Executes a specific tool within the context of a chat session.
  Returns the tool execution result as a chat response.
  """
  ReactorExecuteTool(
    tool: String!
    personaId: String!
    chatSessionId: String!
    callId: String
    args: Any
  ): ReactorChatResponse

  """
  Reports the completion of client-side tool executions back to the server.
  The server persists the actual results (replacing any placeholders) and,
  when continueProcessing is true, re-enters the AI processing loop so the
  agent can see the real tool outputs and continue.
  """
  ReactorCompleteClientToolCalls(
    chatSessionId: String!
    personaId: String!
    results: [ReactorClientToolResultInput!]!
    """When true, the server sends tool results to the AI and continues the conversation"""
    continueProcessing: Boolean
    """Streaming mode for the AI continuation response"""
    streamingMode: StreamingMode
  ): ReactorChatResponse
  
  """
  Adds an image to the current chat conversation for analysis by the persona.
  """
  ReactorAttachFile(file: Upload!, chatSessionId: String!): ReactorChatResponse

  """
  Attaches an existing user file to a chat session.
  """
  ReactorAttachUserFileToSession(params: ReactorAttachUserFileParam!): ReactorAttachFileResult

  """
  Detaches a user file from a chat session.
  """
  ReactorDetachUserFileFromSession(params: ReactorDetachUserFileParam!): ReactorDetachFileResult

  """
  Pins a folder path to the chat session context for the agent.
  """
  ReactorPinFolderToSession(params: ReactorPinFolderParam!): ReactorPinFolderResult

  """
  Removes a pinned folder from the chat session.
  """
  ReactorUnpinFolderFromSession(params: ReactorPinFolderParam!): ReactorUnpinFolderResult

  """
  Permanently removes a chat session and all its messages.
  """
  ReactorDeleteChatSession(id: String!): Boolean

  """
  Triggers manual compaction on a conversation. The LLM summarizes older messages
  which are then archived to truncatedHistory and replaced with a summary.
  Returns compaction stats.
  """
  ReactorCompactConversation(chatSessionId: String!): ReactorCompactionResult

  """
  Interrupts an in-progress auto tool execution loop.
  Signals the server to stop executing tools at the next iteration boundary,
  persists a summary message, and notifies the client via SSE.
  """
  ReactorInterruptToolExecution(
    chatSessionId: String!
    personaId: String!
    reason: String
  ): ReactorChatMessage

  """
  Converts spoken audio to text and sends it as a message to the persona.
  """
  ReactorAskQuestionAudio(audio: Upload!, chatSessionId: String!): ReactorChatResponse

  """
  Starts a voice-enabled chat session with TTS/STT configuration.
  Creates a new chat session (or attaches to an existing one) with voice capabilities.
  """
  ReactorStartVoiceSession(input: ReactorStartVoiceSessionInput!): ReactorVoiceSessionResult

  """
  Ends a voice session. The underlying chat session is preserved.
  """
  ReactorEndVoiceSession(chatSessionId: String!): Boolean

  """
  Sends an audio message and optionally receives the AI response as audio.
  The audio is transcribed, sent through the conversation pipeline, and the
  response is optionally synthesized back to speech.
  """
  ReactorSendVoiceMessage(audio: Upload!, input: ReactorVoiceMessageInput!): ReactorVoiceChatResult

  """
  Sends client-side log entries to the server's ChatSessionResourceManager for a given session.
  Entries are written to the same session log file used by the server, prefixed with [CLIENT].
  Returns the number of accepted/dropped entries. Max 100 entries per call.
  """
  ReactorSessionLog(input: ReactorSessionLogInput!): ReactorSessionLogResult
}

"""
Log level for client-side session log entries.
"""
enum ReactorLogLevel {
  debug
  info
  warn
  error
}

"""
A single log entry sent from the client to be appended to the server session log.
"""
input ReactorSessionLogEntry {
  """The severity level of the log entry"""
  level: ReactorLogLevel!
  """The log message (max 2000 characters)"""
  message: String!
  """Optional structured metadata to attach to the entry"""
  meta: Any
  """Client-side timestamp when the log entry was created"""
  timestamp: Date!
  """Source identifier (e.g. hook or component name) for the log entry"""
  source: String
}

"""
Input for sending a batch of client log entries to the server session logger.
"""
input ReactorSessionLogInput {
  """The chat session ID to log against"""
  chatSessionId: String!
  """Batch of log entries to write (max 100 per call)"""
  entries: [ReactorSessionLogEntry!]!
}

"""
Result of a client session log submission.
"""
type ReactorSessionLogResult {
  """Number of entries successfully written to the session log"""
  accepted: Int!
  """Number of entries that were dropped (e.g. session not found, over limit)"""
  dropped: Int!
}

