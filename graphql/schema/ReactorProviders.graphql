
"""
Defines capabilities and limitations of a specific AI model from any provider.
"""
type ReactorModelDefinition {
  id: String!
  providerId: String!
  name: String!
  version: String
  capabilities: [String!]!
  contextLength: Int
  costPerToken: Float
  inputCostPerToken: Float
  outputCostPerToken: Float
  maxParallelRequests: Int
  supportsStreaming: Boolean
  supportedTools: [String]
  supportedMediaTypes: [String]
}

"""
Configuration for a specific AI provider integration.
"""
type ReactorProviderConfig {
  id: String!
  name: String!
  endpointUrl: String
  apiVersion: String
  models: [ReactorModelDefinition!]!
  defaultModel: String
  status: ReactorProviderStatus!
  capabilities: [String!]!
  rateLimits: ReactorProviderRateLimits
  credentialRequirements: [String]
  authComponentFqn: String
}

"""
Status of a provider including availability and health metrics.
"""
type ReactorProviderStatus {
  available: Boolean!
  lastChecked: Date
  uptime: Float
  responseTime: Float
  errorRate: Float
  quotaRemaining: Float
}

"""
Rate limiting configuration for an AI provider.
"""
type ReactorProviderRateLimits {
  requestsPerMinute: Int
  tokensPerMinute: Int
  concurrentRequests: Int
}

"""
A model paired with its provider, returned by ReactorModelsForPersona query.
"""
type ReactorProviderModelResult {
  provider: ReactorProviderConfig!
  model: ReactorModelDefinition!
}

"""
Represents the authentication configuration status for a provider.
Non-secret echo fields (endpoint, organization, maskedKeyHint) are derived
server-side from redactCredentials(decrypt(...)) so the raw key never reaches the client.
"""
type ReactorProviderAuthConfig {
  provider: String!
  configured: Boolean!
  isDefault: Boolean!
  isAppDefault: Boolean!
  source: String
  endpoint: String
  organization: String
  maskedKeyHint: String
}

"""
Input for saving provider authentication credentials.
"""
input ReactorSaveProviderAuthInput {
  providerId: String!
  credentials: JSON!
  setAsAccountDefault: Boolean
  setAsAppDefault: Boolean
}

"""
Input for removing provider authentication credentials.
"""
input ReactorRemoveProviderAuthInput {
  providerId: String!
}

"""
Per-request provider credential override. The client sends this with each
chat request when the user has chosen to apply credentials only to a specific
chat session. The server uses these for the single request and never persists them.
"""
input ReactorProviderAuthOverrideInput {
  apiKey: String
  endpoint: String
  organization: String
  deploymentName: String
  apiVersion: String
}

"""
Structured-output constraint for a chat turn. `schema` is a JSON Schema
(draft-07 subset) the model must produce output conforming to. Each provider
translates it into its native mechanism (OpenAI response_format, Gemini
responseSchema, Ollama format, Anthropic forced tool_choice).
"""
input ReactorStructuredOutputInput {
  "JSON Schema object. Object schemas should set additionalProperties:false."
  schema: Any!
  "Name for the schema/tool. Defaults to \"response\"."
  name: String
  "Strict schema adherence where the provider supports it. Defaults to true."
  strict: Boolean
}

"""
Provider-agnostic, normalized augmented configuration for a single chat turn.
The server translates the subset each provider supports into its native SDK
payload. Never persisted on the chat session — applies to the single request.
"""
input ReactorProviderConfigInput {
  "Constrain the model's output to a JSON Schema."
  structuredOutput: ReactorStructuredOutputInput
  "Reasoning/thinking depth: low | medium | high."
  reasoningEffort: String
  "Sampling temperature."
  temperature: Float
  "Nucleus sampling (top_p)."
  topP: Float
  "Max output tokens for this turn."
  maxTokens: Int
  "Stop sequences."
  stopSequences: [String!]
  "Multimodal output modalities, e.g. [\"text\", \"image\"] (Gemini/OpenAI)."
  responseModalities: [String!]
  "Provider-specific escape hatch, shallow-merged into the SDK payload last."
  raw: Any
}

extend type Query {
  """
  Returns the authentication status for each provider for the current user,
  including a non-secret echo (endpoint, organization, maskedKeyHint) for
  providers the user has configured.
  """
  ReactorUserProviderAuth: [ReactorProviderAuthConfig!]!
}

extend type Mutation {
  """
  Saves provider authentication credentials for the current user.
  Optionally flags the provider as the user's default (setAsAccountDefault)
  or as the application default (setAsAppDefault, ADMIN only).
  """
  ReactorSaveProviderAuth(input: ReactorSaveProviderAuthInput!): ReactorProviderAuthConfig!

  """
  Removes provider authentication credentials for the current user and
  clears any local default flag for that provider.
  """
  ReactorRemoveProviderAuth(input: ReactorRemoveProviderAuthInput!): Boolean!
}