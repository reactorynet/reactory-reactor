# Node and Node-related types
enum ReactorNodeType {
  INPUT
  OUTPUT
  PROCESS
  SYSTEM
  DATASTORE
  CHILD
  CONNECTION
  DEPENDENCY
  CONTAINER
  CLOUD
  CONSUMER
  CONFIG
  FOLDER
  FILE
  FUNCTION
  ENDPOINT
  DOCUMENT
  SECTION
  TOPIC
  RESOURCE
}

enum ReactorLinkType {
  INPUT
  OUTPUT
  DEPENDENCY
  CONNECTION
  INFERRED
  DIRECT
  CALL
  INHERITS
  IMPLEMENTS
  REFERENCE
  SYMLINK
  CONTAINS
  DOCUMENTS
  MENTIONS
  EMBEDS
}

type ReactorNodeCategory {
  id: ID!
  name: String!
  description: String
  parent: ReactorNodeCategory
  children: [ReactorNodeCategory!]
  nodes: [ReactorNode!]
}

type ReactorNodeMetricType {
  id: Int!
  name: String!
  description: String
  units: String
}

type ReactorNodeMetric {
  id: Int!
  type: ReactorNodeMetricType!
  value: String
}

type ReactorNodeAttributes {
  id: Int!
  key: String!
  value: Any
}

type ReactorNode {
  id: ID!
  nodeId: Int!
  index: Int!
  type: ReactorNodeType!
  key: String!
  categories: [ReactorNodeCategory!]
  nameSpace: String!
  name: String!
  version: String!
  description: String
  # Nullable: placeholder/unresolved nodes (e.g. edge endpoints that are not
  # materialised) have no owning provider.
  providerId: String
  attributes: [ReactorNodeAttributes!]
  metrics: [ReactorNodeMetric!]
  children(paging: PagingRequest, filter: String): [ReactorNode!]
  inputs: [ReactorNode!]
  outputs: [ReactorNode!]
  dependents: [ReactorNode!]
  dependencies: [ReactorNode!]
  parent: ReactorNode
  # Raw parent id — prefer over `parent` when only the id is needed (avoids a
  # node resolution per row; null for catalog/root nodes).
  parentId: Int
  source: String
  data: Any
}
