# Project and Project-related types

type ReactorProjectPathSpec {
  id: Int!
  path: String
  filter: String
  type: String
}

type ReactorProjectFileSpec {
  id: Int!
  path: String
  type: String
  content: String
}

type ReactorProjectError {
  message: String
  stack: String
  provider: String
  link: String
  created: Date
  updated: Date
}

enum ReactorProjectDeploymentStatus {
  PENDING
  DEPLOYING
  SUCCESS
  FAILED
  ROLLBACK
}

type ReactorProjectDeployment {
  id: Int!
  status: ReactorProjectDeploymentStatus!
  environment: ReactorProjectEnvironment
  name: String
  description: String
  url: String
  version: String!
  ciProvider: String
  ciPipeline: String
  ciBranch: String
  ciBuildId: String
  ciBuildUrl: String
  commitHash: String
  commitMessage: String
  commitAuthor: String
  created: Date
  updated: Date
  project: ReactorProject
}

enum ReactorProjectDashboardType {
  CHART
  TABLE
  MAP
  TEXT
  CUSTOM
  LINK
}

type ReactorProjectDashboard {
  id: Int!
  name: String!
  description: String
  component: String
  componentProps: Any
  url: String!
  type: ReactorProjectDashboardType!  
  created: Date
  updated: Date
  project: ReactorProject
}

type ReactoryProjectSlack {
  channel: String!
  channelId: String!
  webhookUrl: String!
  chatBotId: String
  created: Date
  updated: Date
}

type ReactorProjectNote {
  id: Int!
  title: String
  content: String!
  format: String
  createdBy: User
  created: Date
}

type ReactorProjectProcessor {
  id: Int!
  nameSpace: String!
  name: String!
  version: String!
  description: String
  type: String  
  options: Any
  optionsForm: String
  createdBy: User
  created: Date
  updated: Date
}

type ReactorProjectSecurity {
  securityContact: User
  complianceTags: [String!]
  riskLevel: String
  dataClassification: String
  vulnerabilityStatus: String
  lastSecurityReview: Date
  securityNotes: String
  securityPoliciesUrl: String
  encryptionAtRest: Boolean
  encryptionInTransit: Boolean
  dependenciesWithKnownVulnerabilities: Int
  vulnerabilityReportUrl: String
}

enum ReactorProjectStatus {
  ACTIVE
  INACTIVE
  ARCHIVED
  DEPRECATED
}

enum ReactorProjectProcessingStatus {
  PENDING
  PROCESSING
  COMPLETED
  FAILED
  CANCELLED
}

type ReactorProjectProcessingEntry {
  id: Int!
  project: ReactorProject!
  status: ReactorProjectProcessingStatus!
  processor: ReactorProjectProcessor
  started: Date
  completed: Date
  errors: [String!]
  notes: String
}

"""
ReactorProjectDocumentation represents documentation for a project in the Reactor module ecosystem.
Provide content in Markdown format.
This type includes fields for the documentation's title, URL, path, content, format, and metadata such as creation and update timestamps.
It also includes a reference to the user who created the documentation
"""
type ReactorProjectDocumentation {
  id: Int!
  title: String!
  url: String
  path: String
  content: String
  format: String
  createdBy: User
  created: Date
  updated: Date
}

type ReactorSlackChannel {
  id: String!
  name: String!
  description: String
}

type ReactorProjectAlerts {
  id: Int!
  project: ReactorProject!
  alertType: String!
  message: String!
  severity: String! 
  priority: String
  source: String
  status: String
  createdBy: User
  created: Date
  updated: Date
}

type ReactorProjectTask {
  id: Int!
  reference: String
  title: String!
  description: String
  status: String!
  priority: String
  assignedTo: User
  dueDate: Date
  createdBy: User
  created: Date
  updated: Date
}

type ReactorProjectMetrics {
  date: Date
  incidents: Int
  errors: Int
  deployments: Int
  activeDeployments: Int
  openPullRequests: Int
  closedPullRequests: Int
  activeBranches: Int
  totalBranches: Int
  activeTasks: Int
  openedTasks: Int
  closedTasks: Int
  totalTeams: Int
  totalEngineers: Int
}

type ReactoryProjectResource {
  id: Int!
  name: String!
  type: String!
  url: String
  projects: [ReactorProject!]
  description: String
  createdBy: User
  created: Date
  updated: Date
}

type ReactorProjectProcessingConfig {
  id: Int!
  processor: ReactorProjectProcessor!
  options: Any
  optionsForm: String
  status: ReactorProjectProcessingStatus!  
  lastRun: Date
  nextRun: Date
  lastError: String
  lastRunDuration: Int
  createdBy: User
  created: Date
  updated: Date
}

enum ReactorProjectApiType {  
  REST
  OPENAPI
  GRAPHQL
  GRPC
  WEBSOCKET
  SSE
  SOAP
  OTHER
}

enum ProjectApiDirection {
  INBOUND
  OUTBOUND
  BIDRECTIONAL
}

type ReactorProjectApiConnection {
  id: Int!
  name: String!
  description: String
  type: ReactorProjectApiType!
  direction: ProjectApiDirection
  inboudUrl: String
  outboundUrl: String
  api: ReactorProjectApi
  system: ReactorSystem
  project: ReactorProject
  environment: ReactorProjectEnvironment
  createdBy: User
  created: Date
  updated: Date
}

type ReactorProjectApi {
  id: Int!
  nameSpace: String!
  name: String!
  version: String!
  type: ReactorProjectApiType!
  description: String
  baseUrl: String!
  direction: ProjectApiDirection
  connections: [ReactorProjectApiConnection]
  documentationUrl: String
  createdBy: User
  created: Date
  updated: Date
  project: ReactorProject
}

enum ReactorProjectScoreCalculatorType {
  EXPRESSION
  COMPONENT
}

type ReactorProjectScoreCalculator {
  id: Int!
  nameSpace: String!
  name: String!
  version: String!
  description: String
  type: ReactorProjectScoreCalculatorType
  options: Any
  optionsForm: String
  createdBy: User
  created: Date
  updated: Date
}

type ReactorProjectScoreCard {
  id: Int!
  project: ReactorProject!
  score: Float!
  metrics: [ReactorProjectMetrics]
  calculators: [ReactorProjectScoreCalculator!]
  targetScore: Float
  targetScoreDescription: String
  scoreColor: String
  scoreDescription: String
  createdBy: User
  created: Date
  updated: Date  
}

enum ReactorProjectHistoryItemType {
  INCIDENT
  DEPLOYMENT
  TASK
  NOTE
  DOCUMENTATION
  SECURITY
  TEAM
  METRICS
  INFO
  WARNING
  ERROR
  CRITICAL
  SUCCESS
  ROLLBACK
  ROLLBACK_SUCCESS
}

enum ReactorProjectHistoryItemStatus {
  ERROR
  WARNING
  INFO
  SUCCESS
  NORMAL
}

type ReactorProjectHistoryItem {
  id: Int!
  project: ReactorProject!
  type: ReactorProjectHistoryItemType!
  title: String
  description: String
  url: String
  status: ReactorProjectHistoryItemStatus  
  data: Any
  createdBy: User
  created: Date
  updated: Date
}

type ReactorProject {
  id: String!
  client: ReactoryClient
  organization: Organization
  businessUnit: BusinessUnit
  system: ReactorSystem
  fqn: String!
  name: String!
  nameSpace: String!
  version: String!
  """
  Deterministic id of the project's root node in the system graph — the
  catalog node an explorer opens for this project. Null until cataloged.
  """
  graphNodeId: Int
  avatar: String
  icon: String
  repoPath: String
  repoUrl: String
  projectTypes: [String!]
  lastSync: Date
  description: String
  tasksUrl: String
  scoreCards: [ReactorProjectScoreCard]
  environments: [ReactorProjectEnvironment]  
  apis: [ReactorProjectApi]
  apiConnections: [ReactorProjectApiConnection]
  tasks: [ReactorProjectTask]
  projectMetrics: [ReactorProjectMetrics]
  primaryDocumentation: ReactorProjectDocumentation
  additionalDocumentation: [ReactorProjectDocumentation]
  primarySlack: ReactoryProjectSlack
  secondarySlack: [ReactoryProjectSlack]
  dependencies: [ReactorProject]
  pathSpecs: [ReactorProjectPathSpec]
  files: [ReactorProjectFileSpec]
  activeDeployment: ReactorProjectDeployment
  deployments: [ReactorProjectDeployment]
  dashboards: [ReactorProjectDashboard]
  alerts: [ReactorProjectAlerts]
  processorConfigs: [ReactorProjectProcessingConfig]
  resources: [ReactoryProjectResource]  
  owner: User
  ownerTeam: Team
  teams: [Team]
  engineers: [User]
  activeBranch: String
  mainBranch: String!
  branches: [String!]
  tags: [String!]
  created: Date
  updated: Date
  incidentActive: Boolean
  incidentCount: Int
  errors: [ReactorProjectError]
  notes: [ReactorProjectNote]
  projectStatus: ReactorProjectStatus!
  processingHistory: [ReactorProjectProcessingEntry]
  security: ReactorProjectSecurity
  history: [ReactorProjectHistoryItem]
}

type ReactorPagedProjects {
  projects: [ReactorProject]
  paging: PagingResult
}
