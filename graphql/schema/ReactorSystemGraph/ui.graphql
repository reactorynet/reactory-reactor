# UI and Node UI types

type ReactoryNodePosition {
  x: Float!
  y: Float!
}

type ReactorNodeOption {
  id: String!
  key: String!
  value: String!
}

# Deprecated — never wired to any query/mutation/resolver. Superseded by
# ReactorGraphPerspective (perspective.graphql). Retained for compatibility.
type ReactorNodeUI {
  id: Int!
  node: ReactorNode!
  position: ReactoryNodePosition!
  options: [ReactorNodeOption!]!
}

type ReactorPagedNodes {
  nodes: [ReactorNode!]
  paging: PagingResult
}
