# Query types for system graph

enum ReactorCatalogJobState {
  PENDING
  RUNNING
  COMPLETE
  FAILED
}

type ReactorCatalogJobStats {
  filesProcessed: Int
  nodesCreated: Int
  linksCreated: Int
  durationMs: Int
}

type ReactorCatalogJobStatus {
  jobId: String!
  status: ReactorCatalogJobState!
  message: String
  error: String
  stats: ReactorCatalogJobStats
  startedAt: Date
  completedAt: Date
}

extend type Query {
  ReactorCatalogNodes(paging: PagingRequest): ReactorPagedNodes
  ReactorNodeCategories(filter: ReactorNodeCategoryFilter): [ReactorNodeCategory!]
  ReactorNodeCategory(id: Int!): ReactorNodeCategory
  ReactorNodeByCategory(ids: [Int!]): [ReactorNode!]
  ReactorNode(id: Int!, key: String): ReactorNode
  ReactorNodesForType(type: [ReactorNodeType]): [ReactorNode!]
  ReactorNodesByTerm(term: String!): [ReactorNode!]
  """
  The graph node representing a chat conversation, or null if the conversation
  has not been graphed yet. A single indexed lookup on the node's deterministic
  id — do NOT use ReactorNodesByTerm for this: a conversation id never appears
  in a node's name or description, so that search always scans the whole
  collection and always returns nothing.
  """
  ReactorConversationNode(conversationId: String!): ReactorNode
  ReactorNodesByNameAndNameSpace(name: String!, nameSpace: String!, term: String, paging: PagingRequest): ReactorPagedNodes
  ReactorProjects(filter: ReactorProjectFilter): ReactorPagedProjects
  # id is the project's ObjectId string, FQN, name or repo path.
  ReactorProject(id: String!): ReactorProject
  ReactorProjectByName(name: String!): ReactorProject
  ReactorProjectMetrics(projectMetricsQuery: ReactorProjectMetricsQueryInput!): [ReactorProjectMetrics]      
  ReactorCatalogJobStatus(jobId: String!): ReactorCatalogJobStatus
  """
  Registered external graph sources (jira sites, database connections) with
  their sync state.
  """
  ReactorExternalSources: [ReactorExternalSource!]!
}
