"""
An individual AI model turn usage ledger record.
"""
type ReactorAIUsageRecord {
  id: String!
  """
  Nullable: a turn can be logged before the owning session is attributed.
  Reporting counts those in `coverage.turns` less `coverage.attributedTurns`.
  """
  userId: String
  user: User
  organizationId: String
  businessUnitId: String
  chatSessionId: String
  parentSessionId: String
  personaId: String
  """
  Provider that actually served the turn, after routing overrides. Nullable
  because a turn can be recorded without a resolved provider; `unknown` rows are
  reported as a coverage gap rather than attributed to a default.
  """
  provider: String
  """Model that actually served the turn, after routing overrides."""
  model: String
  promptTokens: Int!
  completionTokens: Int!
  totalTokens: Int!
  """
  Cost in USD cents. NULL when the model has no known price — 'unknown',
  deliberately distinct from 0, which means a genuinely free model. Reporting an
  unpriced model as 0 was the previous behaviour and it understated spend
  invisibly; `coverage.unpricedTurns` now counts those turns instead.
  """
  costUsdCents: Float
  """Cost in USD. NULL when the model has no known price; see costUsdCents."""
  costUsd: Float
  """
  How the token counts were obtained: 'provider' (measured), 'estimated', or
  'none'. Kept distinct so a fabricated figure is never presented as measured.
  """
  usageSource: String
  costCurrency: String!
  durationMs: Int
  timeToFirstTokenMs: Int
  use_case: String
  status: String!
  errorCode: String
  errorMessage: String
  toolCallsCount: Int
  toolsUsed: [String!]
  createdAt: Date!
  updatedAt: Date!
}

"""
A single day or period data point in an AI usage time series.
"""
type ReactorAIUsageTimeSeriesPoint {
  date: String!
  promptTokens: Float!
  completionTokens: Float!
  totalTokens: Float!
  costUsdCents: Float!
  costUsd: Float!
  requests: Int!
}

"""
Breakdown of token usage and costs per model.
"""
type ReactorModelUsageBreakdown {
  model: String!
  provider: String!
  promptTokens: Float!
  completionTokens: Float!
  totalTokens: Float!
  costUsdCents: Float!
  costUsd: Float!
  requests: Int!
}

"""
Breakdown of token usage and costs per provider.
"""
type ReactorProviderUsageBreakdown {
  provider: String!
  totalTokens: Float!
  costUsdCents: Float!
  costUsd: Float!
  requests: Int!
}

"""
Breakdown of token usage and costs per user (admin view).
"""
type ReactorUserUsageBreakdown {
  userId: String!
  firstName: String
  lastName: String
  email: String
  totalTokens: Float!
  costUsdCents: Float!
  costUsd: Float!
  requests: Int!
}


"""
How much of the requested window the reported figures actually cover.

Present so a caller can tell a complete total from a partial one. A total over
80% of turns is a different claim from a total over all of them, and the two
failure modes that used to be silent are counted here instead: a model with no
known price (excluded from cost, not treated as free) and token counts that were
estimated rather than reported.
"""
type ReactorUsageCoverage {
  """Assistant turns carrying a usage envelope — the denominator."""
  turns: Int!
  """Turns with a resolved provider and model."""
  attributedTurns: Int!
  """Turns whose cost could be priced."""
  pricedTurns: Int!
  """Turns excluded from the cost total because no price is known."""
  unpricedTurns: Int!
  """Turns whose token counts were estimated rather than reported."""
  estimatedTurns: Int!
  """Turns that reported a usage envelope of all zeros."""
  zeroUsageTurns: Int!
  """Turns whose routed provider differed from the one the session declared."""
  reroutedTurns: Int!
}

"""
Failures grouped by the provider and model that was serving when the turn failed.

The actionable form of the question: "40 errors" says nothing about what to do, whereas
"6% of gemini-3.7-flash turns failed, all retryable" says where to look.
"""
type ReactorUsageFailureBreakdown {
  provider: String!
  model: String!
  failures: Int!
  """Failures judged retryable at the time — an availability signal."""
  retryableFailures: Int!
  """Attempts consumed by these failures, including retries."""
  totalAttempts: Int!
  lastErrorCode: String
  lastErrorMessage: String
}


"""
Aggregated AI usage summary with metrics, time-series trend, and model/provider breakdowns.
"""
# Token totals are Float, not Int: summed over a tenant they pass 2^31 (5.9 billion
# prompt tokens on the dev tenant), which GraphQL's 32-bit Int cannot represent.
# Float is exact to 2^53. Per-turn fields and budget limits stay Int.
type ReactorAIUsageSummary {
  totalPromptTokens: Float!
  totalCompletionTokens: Float!
  totalTokens: Float!
  totalCostUsdCents: Float!
  totalCostUsd: Float!
  totalRequests: Int!
  avgDurationMs: Int
  errorCount: Int!
  """
  Failed turns as a share of all turns attempted, in 0..1.
  The rate rather than the count is the actionable figure: a raw count scales with
  traffic, so it measures how busy the window was rather than how reliable the AI is.
  """
  errorRate: Float!
  """Failures grouped by the provider and model that was serving."""
  errorBreakdown: [ReactorUsageFailureBreakdown!]!
  timeSeries: [ReactorAIUsageTimeSeriesPoint!]!
  modelBreakdown: [ReactorModelUsageBreakdown!]!
  providerBreakdown: [ReactorProviderUsageBreakdown!]!
  userBreakdown: [ReactorUserUsageBreakdown!]
  coverage: ReactorUsageCoverage!
}

"""
Paginated list of AI usage ledger records.
"""
type ReactorAIUsageQueryResult {
  records: [ReactorAIUsageRecord!]!
  total: Int!
  page: Int!
  pageSize: Int!
  hasNext: Boolean!
}

"""
User AI budget definition and current period spend status.
"""
type ReactorUserBudget {
  id: String!
  userId: String!
  user: User
  organizationId: String
  monthlyTokenLimit: Int
  dailyTokenLimit: Int
  monthlyCostLimitUsd: Float
  dailyCostLimitUsd: Float
  currentMonthTokens: Float!
  currentMonthCostUsd: Float!
  currentDayTokens: Float!
  currentDayCostUsd: Float!
  alertThresholdPercent: Int!
  hardStop: Boolean!
  status: String!
  lastResetDate: Date
  lastDailyResetDate: Date
  notes: String
  createdAt: Date!
  updatedAt: Date!
}

"""
Status of the current user's AI budget quota and allowed status.
"""
type ReactorUserUsageStatus {
  allowed: Boolean!
  status: String!
  percentageUsed: Int!
  reason: String
  budget: ReactorUserBudget
}

"""
Filter for querying AI usage summaries and ledger records.
"""
input ReactorUsageFilterInput {
  userId: String
  organizationId: String
  businessUnitId: String
  provider: String
  model: String
  personaId: String
  startDate: String
  endDate: String
  use_case: String
}

"""
Input for setting or updating a user's AI budget.
"""
input ReactorSetUserBudgetInput {
  userId: String!
  monthlyTokenLimit: Int
  dailyTokenLimit: Int
  monthlyCostLimitUsd: Float
  dailyCostLimitUsd: Float
  alertThresholdPercent: Int
  hardStop: Boolean
  notes: String
}

"""
Filter for querying user budgets.
"""
input ReactorBudgetFilterInput {
  userId: String
  organizationId: String
  status: String
}

extend type Query {
  """
  Get aggregated AI usage summary (admin or filtered view).
  """
  ReactorAIUsageSummary(filter: ReactorUsageFilterInput): ReactorAIUsageSummary!

  """
  Get paginated AI usage ledger records (admin or filtered view).
  """
  ReactorAIUsageList(filter: ReactorUsageFilterInput, page: Int, pageSize: Int): ReactorAIUsageQueryResult!

  """
  Get aggregated AI usage summary for the currently authenticated user.
  """
  ReactorMyAIUsage(filter: ReactorUsageFilterInput): ReactorAIUsageSummary!

  """
  Get the current user's AI quota and budget enforcement status.
  """
  ReactorUserUsageStatus: ReactorUserUsageStatus!

  """
  Get user budgets list (admin view).
  """
  ReactorUserBudgets(filter: ReactorBudgetFilterInput): [ReactorUserBudget!]!

  """
  Get a specific user's budget settings.
  """
  ReactorUserBudget(userId: String!): ReactorUserBudget
}

extend type Mutation {
  """
  Set or update a user's AI usage budget (admin only).
  """
  ReactorSetUserBudget(input: ReactorSetUserBudgetInput!): ReactorUserBudget!

  """
  Delete a user's AI usage budget (admin only).
  """
  ReactorDeleteUserBudget(id: String!): Boolean!
}
