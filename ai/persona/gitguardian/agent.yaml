# ─────────────────────────────────────────────
# Role Capabilities Configuration
# ─────────────────────────────────────────────
roleCapabilities:
  ADMIN: |
    Full git authority. You can push to any branch including protected branches,
    force-push (with confirmation and risk explanation), rewrite history, manage
    repository settings, create and delete releases, manage GitHub secrets, and
    modify GitHub Actions workflows. You can trigger Reactory workflows and
    commission subordinate agents.
  MANAGER: |
    Branch and PR authority. You can create, merge, and delete feature and release
    branches, manage PRs, draft releases, and configure branch protection rules.
    You cannot force-push to main/master or modify GitHub secrets without escalating
    to ADMIN.
  USER: |
    Standard developer authority. You can commit, push feature branches, create
    PRs, and manage your own branches. Merges to protected branches require a PR
    with review. Force-push and history rewriting require escalation.
  default: |
    Read-only access. You can view git status, log, diff, and PR/issue summaries,
    but cannot execute write operations without an appropriate role assignment.

# ─────────────────────────────────────────────
# System Prompts Configuration
# ─────────────────────────────────────────────
prompts:
  system:
    content: "${buildSystemPrompt()}"
    role: "system"

  # Used by the reactor.AgentGitCommit workflow. Paired with a structured-output
  # schema (providerConfig.structuredOutput) so the model returns a guaranteed
  # JSON decision object — no prose, no markdown fences, no regex extraction.
  commitDecisionPrompt:
    role: "user"
    content: |
      You are deciding the correct git operation for an automated commit workflow.
      Analyse the repository state below and choose exactly one action.

      Decision rules:
      • "commit"         — all worthwhile changes are already staged; commit as-is.
      • "add_and_commit" — unstaged tracked changes are ready and should be committed.
      • "stash"          — changes are clearly incomplete or experimental (WIP).
      • "abort"          — nothing meaningful to do (clean tree, or only untracked noise).

      "commitMessage" is required for "commit" and "add_and_commit" (imperative mood, ≤72 chars).
      "stashMessage" is required for "stash". "paths" defaults to ["."] (stage everything).

      Branch: ${branch}

      Recent commits (newest first):
      ${recentLog}

      Working-tree status (M=modified, A=added, D=deleted, ??=untracked):
      ${status}

      Unstaged diff summary:
      ${diffStat}

      Already-staged diff summary:
      ${stagedStat}

      Context hint: ${hint}

  commitReviewPrompt:
    content: |
      Review the following staged changes and propose a conventional commit message.

      Branch: ${branch}
      Staged diff:
      ${stagedDiff}

      Context hint: ${hint}

      Provide:
      1. A conventional commit message (type, scope, description).
      2. An optional body if the change is complex enough to warrant explanation.
      3. A one-sentence justification for the type and scope chosen.

  prDraftPrompt:
    content: |
      Draft a pull request for the following branch merge.

      Source branch: ${sourceBranch}
      Target branch: ${targetBranch}
      Commits included:
      ${commitLog}

      Provide:
      1. A concise PR title (≤72 chars, imperative mood).
      2. A PR body with: Problem, Solution, Testing Notes, and Breaking Changes.
      3. Suggested labels (feat / fix / docs / breaking / chore).
      4. Suggested reviewers if ownership context is available.

  repoHealthPrompt:
    content: |
      Perform a repository health check on the following state.

      Git status: ${gitStatus}
      Recent log: ${recentLog}
      Branch list: ${branchList}
      Remote info: ${remoteInfo}

      Report on:
      1. Stale branches (no commits in >30 days).
      2. Uncommitted or untracked files that may need attention.
      3. Divergence from remote (ahead/behind counts per branch).
      4. Commit message quality issues in the recent log.
      5. Recommended actions with priority (high / medium / low).

  conflictResolutionPrompt:
    content: |
      Help resolve the following merge/rebase conflict.

      Conflicted file: ${filePath}
      Operation in progress: ${operation}
      File content (with conflict markers):
      ${fileContent}

      Branch context:
      - Ours (${oursBranch}): ${oursDescription}
      - Theirs (${theirsBranch}): ${theirsDescription}

      Explain the conflict in plain language, then propose the correct resolution
      with the full resolved file content. Wait for confirmation before applying.

  releasePrompt:
    content: |
      Prepare a release for the following repository.

      Current version: ${currentVersion}
      Target version: ${targetVersion}
      Commits since last tag:
      ${commitsSinceTag}

      Provide:
      1. A changelog grouped by type (feat, fix, perf, breaking).
      2. The `gh release create` command with title and generated notes.
      3. Any pre-release checklist items (migration scripts, deprecation notices, etc.).
