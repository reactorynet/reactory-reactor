    created: "2026-07-13T00:00:00.000Z"

# ─────────────────────────────────────────────
# Role Capabilities Configuration
# ─────────────────────────────────────────────
roleCapabilities:
  ADMIN: |
    Full QA authority. You can run any test suite (unit, integration, e2e),
    modify test configuration files (jest.config, pytest.ini, coverage thresholds),
    write and fix tests in any module, update CI/CD pipeline YAML for test stages,
    and directly commit test fixes. You can escalate to ReactorAIPersona for
    complex code bugs and commission subordinate agents if needed.
  MANAGER: |
    Operational QA authority. You can run all test suites, write new tests,
    fix straightforward test-level failures, and generate coverage reports.
    You cannot modify root test configuration files or CI pipeline definitions
    without escalating to ADMIN.
  USER: |
    Standard QA access. You can run tests against your assigned module or
    feature area, view coverage reports, and request test authoring assistance.
    Writing or modifying tests in shared utilities or CI configuration requires
    escalation to MANAGER or ADMIN.
  default: |
    Read-only QA access. You can view test results, coverage summaries, and
    findings reports, but cannot execute write operations without an appropriate
    role assignment.

# ─────────────────────────────────────────────
# System Prompts Configuration
# ─────────────────────────────────────────────
prompts:
  system:
    content: "${buildSystemPrompt()}"
    role: "system"

  testRunPrompt:
    content: |
      Run the test suite for the following target and report results.

      Repository: ${repoName}
      Target path or pattern: ${testPattern}
      Coverage required: ${coverageRequired}

      Steps:
      1. Read the relevant jest/pytest config to confirm the correct run command.
      2. Execute the tests with the shell tool. Capture stdout and stderr.
      3. Report: total tests, passing, failing, skipped.
      4. If coverage was requested, report per-file coverage for files below 80%.
      5. For each failure: test name, error message, first relevant stack frame.

  coverageAnalysisPrompt:
    content: |
      Analyse the coverage report for the following scope and identify gaps.

      Repository: ${repoName}
      Scope (module or directory): ${scope}
      Coverage report path: ${coverageReportPath}

      Provide a table of files sorted by coverage (ascending) with columns:
        File | Lines% | Branches% | Functions% | Uncovered line ranges

      Then list the top 5 files that would most benefit from new tests,
      with a one-sentence explanation of why each is high priority.

  testAuthorPrompt:
    content: |
      Write comprehensive unit tests for the following source file.

      Source file: ${sourceFilePath}
      Existing test file (if any): ${existingTestPath}
      Current coverage: ${currentCoverage}
      Target coverage: 80%

      Before writing:
      1. Read the source file to understand its exports, logic, and dependencies.
      2. Read the nearest existing test file to match style and tooling.
      3. Identify which branches, edge cases, and error paths are currently untested.

      Write tests that cover:
      - Happy path for each exported function/method.
      - Edge cases: empty input, null/undefined, boundary values.
      - Error paths: thrown exceptions, rejected promises, invalid arguments.
      - Any branch conditions not yet covered.

      After writing, run the new test file and report coverage improvement.

  findingsReportPrompt:
    content: |
      Generate a QA findings report for the following session.

      Scope: ${scope}
      Date: ${date}
      Tests run: ${testsRun}
      Tests passing: ${testsPassing}
      Tests failing: ${testsFailing}
      Coverage before: ${coverageBefore}
      Coverage after: ${coverageAfter}
      Escalations: ${escalations}

      Format the report using the standard findings report template.
      Include a prioritised list of remaining actions with suggested owners.

  escalationPrompt:
    content: |
      Prepare a structured bug handoff for ReactorAIPersona.

      Failing test: ${failingTest}
      Source file: ${sourceFile}
      Error message: ${errorMessage}
      Stack trace: ${stackTrace}
      Root cause hypothesis: ${hypothesis}

      Write a clear, concise message for ReactorAIPersona that includes:
      1. The failing test name and file path.
      2. The exact error and stack trace.
      3. The source file most likely responsible.
      4. Your hypothesis about the root cause.
      5. What the fix should accomplish (without prescribing the exact implementation).
      6. A request to notify Quinn when the fix is ready for verification.
