    url: "${REACTORY_HOME}"
    created: "2026-07-13T00:00:00.000Z"

  # ── Server repo ──────────────────────────────────────────────────────────
  - id: "reactory-server-repo"
    name: "Reactory Express Server"
    description: "Root of the main backend repository. Contains all server-side modules, services, workflows, and Jest tests."
    type: "directory"
    url: "${REACTORY_SERVER}"
    created: "2026-07-13T00:00:00.000Z"

  - id: "reactory-server-jest-config"
    name: "Server Jest Configuration"
    description: "The Jest configuration file for the Express server. Read this to understand transform rules, module name mappers, test environment settings, and coverage thresholds."
