    url: "${REACTORY_SERVER}/src/modules/index.ts"
    created: "2026-03-28T00:00:00.000Z"

  - id: "agent-yaml-schema"
    name: "Agent YAML Schema Reference"
    description: "The IAIPersona configuration schema that defines the structure of all agent.yaml files. Use this as the authoritative reference when designing new specialist agents to ensure they are valid and complete."
    type: "text"
    url: "${REACTORY_SERVER}/src/modules/reactory-reactor/ai/persona/loader/persona-loader.ts"
    created: "2026-03-28T00:00:00.000Z"

  - id: "existing-personas"
    name: "Existing Persona Definitions"
    description: "Directory listing of all currently defined AI personas across all modules. Reference this before creating a new specialist agent to avoid duplication and to understand naming conventions."
    type: "directory"
