# ─────────────────────────────────────────────
# Role Capabilities Configuration
# ─────────────────────────────────────────────
roleCapabilities:
  ADMIN: |
    Full UI/UX engineering authority. You can author, publish, hot-reload, and persist
    ReactoryForm definitions to disk and database. You can register custom widgets into
    the global component registry, modify application theme palettes, define application
    routes, and configure production GraphQL/REST data pipelines.
  DEVELOPER: |
    Standard UI/UX development authority. You can author new form definitions, design
    custom widgets, wire GraphQL queries and mutations, configure REST data managers,
    and mount test forms in the persistent side panel for interactive validation.
  ENGINEER: |
    Standard UI/UX engineering authority. You can author new form definitions, design
    custom widgets, wire GraphQL queries and mutations, configure REST data managers,
    and mount test forms in the persistent side panel for interactive validation.
  USER: |
    Interactive form usage authority. You can review existing forms, suggest UX improvements,
    fill out and submit forms, and view interactive dashboards and charts. Modifying global
    form definitions or application routes requires escalation to DEVELOPER or ADMIN.
  default: |
    Read-only form browsing access. You can inspect rendered forms, view widget documentation,
    and review schema definitions.

# ─────────────────────────────────────────────
# System Prompts Configuration
# ─────────────────────────────────────────────
prompts:
  system:
    content: "${buildSystemPrompt()}"
    role: "system"

  formDesignPrompt:
    content: |
      Design a complete, production-grade ReactoryForm definition based on the following requirements:
      Feature / Entity: ${entityName}
      Use Case: ${useCase}
      Target Audience / Roles: ${roles}
      Data Backend: ${backend} (graphql, rest, local)
      Requirements & Fields:
      ${fieldRequirements}

      Provide:
      1. Complete JSON Schema (draft-07) with appropriate types, titles, descriptions, format constraints, enums, and required fields.
      2. UI Schema using 'ui:field': 'GridLayout' with responsive 12-column breakpoints ('xs', 'sm', 'md', 'lg'), widget mappings, and 'ui:options'.
      3. Complete data wiring ('graphDefinition' for GraphQL queries/mutations or 'rest' for RESTful endpoints) with variables mapping and success handlers.
      4. Container options ('ui:form') including componentType, toolbarPosition, and custom action buttons.
      5. Full runnable IReactoryForm definition ready for registration.

  widgetAuthorPrompt:
    content: |
      Author a custom React + Material-UI widget component for ReactoryForm:
      Widget Name: ${widgetName}
      Namespace: ${nameSpace}
      Version: ${version}
      Purpose & UX Behavior:
      ${widgetRequirements}

      Provide:
      1. Full TypeScript React component implementing the IReactoryWidgetProps interface.
      2. Clean Material-UI (MUI v5/v6) layout utilizing 'sx' styling, typography, colors, and accessibility.
      3. Dynamic component resolution using 'reactory.getComponents' where necessary.
      4. Component registration block with 'registerComponent' and AMQ plugin loaded event.
      5. Example 'widgetMap' entry and 'uiSchema' property configuration for consuming the widget.

  dataWiringPrompt:
    content: |
      Configure and wire the data layer for the following ReactoryForm:
      Form FQN: ${formFqn}
      Backend Type: ${backendType} (graphql | rest)
      Data Operations: ${operations} (read, create, update, delete)
      Schema / Fields:
      ${schemaDetails}

      Provide:
      1. For GraphQL:
         - Query document with variable definitions, variables mapping from props/context/formData, and resultMap.
         - Mutation documents for 'new' and 'edit' modes with variable bindings and response transforms.
         - Comprehensive success handlers ('onSuccessMethod', 'onSuccessEvent', 'onSuccessUrl', 'notification').
         - Error handlers with 'onError' componentRef and logging methods.
      2. For REST:
         - Named 'queries' with templated URLs ('${formData.id}', '${formContext.reactory.API_ROOT}'), HTTP methods, and headers.
         - Mode-mapped 'mutations' ('new', 'edit', 'delete') with request bodies and URL templates.
      3. Test queries or curl commands to verify the endpoints against the backend.

  dashboardCompositionPrompt:
    content: |
      Design an interactive enterprise dashboard view combining forms, tables, metric cards, and charts:
      Dashboard Title: ${dashboardTitle}
      Domain / Context: ${domainContext}
      Key Metrics: ${metrics}
      Interactive Components Needed:
      ${componentsList}

      Provide:
      1. Overall layout architecture using Material-UI Grid and Paper/Card containers.
      2. ReactoryForm definition for high-density tabular data using 'MaterialTableWidget' with custom columns, badges, and action handlers.
      3. Chart specifications for side-panel rendering using the 'chart' tool (pie, bar, line, composed) or 'd3' visualization.
      4. AMQ event wiring allowing interactive filtering and cross-widget synchronization.
      5. Visual aesthetic recommendations (color tokens, elevation, spacing, dark mode support).

  formReviewPrompt:
    content: |
      Conduct a comprehensive UI/UX, accessibility, and performance audit of the following ReactoryForm:
      Form Definition / Code:
      ${formDefinition}

      Evaluate:
      1. **Visual Hierarchy & Layout**: Is the grid layout clean, balanced, and responsive across screen sizes?
      2. **Input Ergonomics**: Are input types, placeholders, help texts, and widgets appropriate for each field?
      3. **Data Plumbing**: Are GraphQL/REST queries, variables, result maps, and mutation success handlers correctly configured?
      4. **Validation & Feedback**: Are validation constraints intuitive? Are loading and error states handled gracefully?
      5. **Accessibility (WCAG 2.1 AA)**: Are labels, ARIA attributes, contrast ratios, and keyboard navigation supported?
      6. **Actionable Recommendations**: Prioritised list of enhancements with before/after code patches.
