# Reactory AI Provider & Model Registry
# This file defines all available AI providers and their models.
# Environment variables are interpolated using ${VAR_NAME:-default} syntax.
#
# Provider availability is determined at runtime based on whether
# the required API keys are configured.

providers:
  - id: openai
    name: OpenAI
    endpointUrl: "${OPENAI_API_URL:-https://api.openai.com/v1}"
    apiVersion: v1
    defaultModel: gpt-4o
    capabilities:
      - text-generation
      - code-generation
      - image-generation
      - speech-to-text
      - image-understanding
    credentialRequirements:
      - apiKey
      - organization
    credentialEnvVars:
      apiKey: OPENAI_API_KEY
    models:
      - id: gpt-4o
        name: GPT-4o
        version: "2024-05-13"
        capabilities:
          - text-generation
          - code-generation
          - image-understanding
          - reasoning
        contextLength: 128000
        supportsStreaming: true
        supportedTools:
          - function-calling
        supportedMediaTypes:
          - text
          - image
      - id: gpt-4o-mini
        name: GPT-4o Mini
        version: "2024-07-18"
        capabilities:
          - text-generation
