# Reactory AI Provider & Model Registry
# This file defines all available AI providers and their models.
# Environment variables are interpolated using ${VAR_NAME:-default} syntax.
#
# Provider availability is determined at runtime based on whether
# the required API keys are configured.
#
# Pricing model:
# Each model has a `pricing` block with these float fields (USD cents per unit; null = unpriced):
#   inputPerTokenUsdCents           standard prompt tokens
#   outputPerTokenUsdCents          standard completion tokens
#   cachedInputPerTokenUsdCents     cache reads (OpenAI/Anthropic/Gemini context caching)
#   cacheWritePerTokenUsdCents      cache writes (Anthropic charges extra)
#   reasoningPerTokenUsdCents       reasoning/thinking tokens when billed separately
#   audioInputPerSecondUsdCents     speech-to-text input
#   audioOutputPerSecondUsdCents    TTS output
#   videoInputPerSecondUsdCents     video input
#   videoOutputPerSecondUsdCents    video output
#   imageGenerationPerImageUsdCents flat per-image fallback (use imageGenerationTiers when price varies by size/quality)
#   imageGenerationTiers            optional list of { match: { size, quality }, usdCents }
#   embeddingPerTokenUsdCents       text-embedding models
#   currency                        always "USD" for now
#   pricingEffectiveFrom            ISO date this pricing took effect
#
# Rate limits: rpm (requests/min), itpm (input tokens/min), otpm (output tokens/min).
# Several providers expose account/tier specific limits only; values may be null and
# should be resolved at runtime from provider dashboards.

providers:
  - id: openai
    name: OpenAI
    endpointUrl: "${OPENAI_API_URL:-https://api.openai.com/v1}"
    apiVersion: v1
    defaultModel: gpt-4o
    capabilities:
      - text-generation
      - code-generation
      - image-generation
      - speech-to-text
      - image-understanding
    credentialRequirements:
      - apiKey
      - organization
    credentialEnvVars:
      apiKey: OPENAI_API_KEY
    models:
      - id: gpt-5.4
        name: GPT-5.4
        version: "2026-03"
        capabilities:
          - text-generation
          - code-generation
          - image-understanding
          - reasoning
        contextLength: 1050000
        rpm: null
        itpm: null
        otpm: null
        supportsStreaming: true
        supportedTools:
          - function-calling
        supportedMediaTypes:
          - text
          - image
        pricing:
          inputPerTokenUsdCents: 0.00025
          outputPerTokenUsdCents: 0.0015
          cachedInputPerTokenUsdCents: null
