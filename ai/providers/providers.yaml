# Reactory AI Provider & Model Registry
# This file defines all available AI providers and their models.
# Environment variables are interpolated using ${VAR_NAME:-default} syntax.
#
# Provider availability is determined at runtime based on whether
# the required API keys are configured.
#
# Pricing and limits metadata fields:
# - inputCostPerTokenUsdCents / outputCostPerTokenUsdCents: USD cents per token
# - rpm: requests per minute
# - itpm: input tokens per minute
# - otpm: output tokens per minute
#
# Note: Several providers expose account/tier specific limits only.
# For those models, values are null and should be resolved at runtime from provider dashboards.

providers:
  - id: openai
    name: OpenAI
    endpointUrl: "${OPENAI_API_URL:-https://api.openai.com/v1}"
    apiVersion: v1
    defaultModel: gpt-4o
    capabilities:
      - text-generation
      - code-generation
      - image-generation
      - speech-to-text
      - image-understanding
    credentialRequirements:
      - apiKey
      - organization
    credentialEnvVars:
      apiKey: OPENAI_API_KEY
    models:
      - id: gpt-5.4
        name: GPT-5.4
        version: "2026-03"
        capabilities:
          - text-generation
          - code-generation
          - image-understanding
          - reasoning
          - structured-output
        contextLength: 1050000
        rpm: null
        itpm: null
        otpm: null
        inputCostPerTokenUsdCents: 0.00025
        outputCostPerTokenUsdCents: 0.0015
        supportsStreaming: true
        supportedTools:
          - function-calling
        supportedMediaTypes:
          - text
          - image
      - id: gpt-5.4-mini
