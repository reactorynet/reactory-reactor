  - id: anthropic
    name: Anthropic
    endpointUrl: "${ANTHROPIC_API_BASE_URL:-https://api.anthropic.com}"
    apiVersion: v1
    defaultModel: claude-opus-4-8
    capabilities:
      - text-generation
      - code-generation
      - reasoning
      - image-understanding
    credentialRequirements:
      - apiKey
    credentialEnvVars:
      apiKey: ANTHROPIC_API_KEY
    models:
      - id: claude-fable-5
        name: Claude Fable 5
        version: "5"
        # temperature/top_p/top_k removed on Fable 5 — sending any returns 400.
        sampling:
          temperature: false
          topP: false
          topK: false
        # Fable 5 thinks always-on; use adaptive (budget_tokens returns 400).
        thinking:
          mode: adaptive
          effort: high
          display: summarized
        capabilities:
          - text-generation
          - code-generation
          - reasoning
          - image-understanding
          - structured-output
        contextLength: 1000000
        rpm: 50
        itpm: 30000
        otpm: 8000
        inputCostPerTokenUsdCents: 0.001
        outputCostPerTokenUsdCents: 0.005
        supportsStreaming: true
        supportedTools:
          - function-calling
        supportedMediaTypes:
          - text
          - image
      - id: claude-opus-4-8
        name: Claude Opus 4.8
        version: "4.8"
        # temperature/top_p/top_k removed on Opus 4.8 — sending any returns 400.
        sampling:
          temperature: false
          topP: false
          topK: false
        # Adaptive thinking only on Opus 4.8 (budget_tokens returns 400).
        thinking:
          mode: adaptive
          effort: high
          display: summarized
        capabilities:
          - text-generation
          - code-generation
          - reasoning
          - image-understanding
          - structured-output
        contextLength: 1000000
        rpm: 50
        itpm: 30000
